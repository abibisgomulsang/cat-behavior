var S={shell:{maxWidth:520,margin:"0 auto",minHeight:"100dvh",background:"#111119",position:"relative",overflow:"hidden",display:"flex",flexDirection:"column"},home:{minHeight:"100dvh",background:"linear-gradient(170deg,#13131f,#161630 40%,#0d1b3a)",padding:"0 20px 28px",display:"flex",flexDirection:"column",alignItems:"center",position:"relative"},logoWrap:{textAlign:"center",paddingTop:44,marginBottom:16,animation:"fadeUp .6s ease-out"},logoCircle:{width:90,height:90,borderRadius:45,background:"linear-gradient(135deg,#FF6B6B,#FF8C42,#4ECDC4)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 12px",boxShadow:"0 6px 28px rgba(255,107,107,.25)",animation:"pulse 3s ease-in-out infinite"},tipBox:{background:"rgba(255,255,255,.06)",borderRadius:12,padding:"10px 14px",display:"flex",alignItems:"center",gap:8,width:"100%",marginBottom:20,border:"1px solid rgba(255,255,255,.05)"},modeCard:{width:"100%",background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.06)",borderRadius:14,padding:"15px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer",textAlign:"left"},histBtn:{marginTop:14,padding:"11px 22px",background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.08)",borderRadius:12,color:"#aab",fontSize:12.5,width:"100%"},topBar:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",background:"#333",position:"sticky",top:0,zIndex:10,flexShrink:0},topTitle:{color:"#fff",fontSize:15,fontWeight:700},topBtn:{background:"rgba(255,255,255,.18)",color:"#fff",padding:"7px 14px",borderRadius:8,fontSize:12.5},scroll:{flex:1,overflowY:"auto",background:"linear-gradient(180deg,#13131f,#161630)",WebkitOverflowScrolling:"touch"},camWrap:{position:"relative",width:"100%",aspectRatio:"4/3",background:"#000",overflow:"hidden",flexShrink:0},video:{width:"100%",height:"100%",objectFit:"cover",display:"block"},camOverlay:{position:"absolute",inset:0,background:"rgba(0,0,0,.75)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",backdropFilter:"blur(3px)",zIndex:3},liveBar:{display:"flex",alignItems:"center",gap:8,padding:"10px 16px",background:"rgba(255,255,255,.04)",borderBottom:"1px solid rgba(255,255,255,.06)"},errBox:{margin:"14px 18px",padding:"14px 16px",background:"rgba(255,80,80,.12)",border:"1px solid rgba(255,80,80,.25)",borderRadius:12,color:"#ff7070",fontSize:12,display:"flex",flexDirection:"column",gap:10,wordBreak:"break-all"},resTxt:{padding:"12px 18px 16px",color:"#ccccdd",fontSize:13.5,lineHeight:1.8,whiteSpace:"pre-wrap"},hItem:{width:"100%",background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.06)",borderRadius:14,padding:14,cursor:"pointer",textAlign:"left",display:"block",marginBottom:10}};

function ResultText(p){var lines=p.text.split("\n");return html`<div style=${S.resTxt}>${lines.map(function(l,i){return html`<p key=${i} style=${{margin:l.trim()?"5px 0":"10px 0",lineHeight:1.75}}>${l}</p>`;})}</div>`;}
function callAPI(body){return fetch(WORKER_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){return r.json();});}
function parseSub(t){var s="",m="";t.split("\n").forEach(function(l){l=l.trim();if(l.startsWith("[자막]"))s=l.replace("[자막]","").trim();else if(l.startsWith("[기분]"))m=l.replace("[기분]","").trim();});return{subtitle:s,mood:m};}
function imgToB64(src,maxW,quality){
  var c=document.createElement("canvas"),img=new Image();
  return new Promise(function(ok){img.onload=function(){var sc=Math.min(maxW/img.width,1);c.width=img.width*sc;c.height=img.height*sc;c.getContext("2d").drawImage(img,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",quality).split(",")[1]);};img.src=src;});
}

function App(){
  var _m=useState(null),mode=_m[0],setMode=_m[1];
  var _s=useState("home"),screen=_s[0],setScreen=_s[1];
  // source: null=선택전, "cam"=카메라, "photo"=사진, "video"=영상
  var _src=useState(null),source=_src[0],setSource=_src[1];
  var _e=useState(null),error=_e[0],setError=_e[1];
  var _h=useState([]),history=_h[0],setHistory=_h[1];
  var _t=useState(TIPS[0]),tip=_t[0],setTip=_t[1];
  var _v=useState(null),viewItem=_v[0],setViewItem=_v[1];
  var _cr=useState(false),camReady=_cr[0],setCamReady=_cr[1];
  var _ce=useState(null),camError=_ce[0],setCamError=_ce[1];
  var _f=useState("environment"),facing=_f[0],setFacing=_f[1];
  var _l=useState(false),liveOn=_l[0],setLiveOn=_l[1];
  var _c=useState(0),cnt=_c[0],setCnt=_c[1];
  var _p=useState(false),paused=_p[0],setPaused=_p[1];
  var _sub=useState(""),subtitle=_sub[0],setSubtitle=_sub[1];
  var _mood=useState(""),mood=_mood[0],setMood=_mood[1];
  var _detail=useState(""),detail=_detail[0],setDetail=_detail[1];
  var _subL=useState(false),subLoading=_subL[0],setSubLoading=_subL[1];
  var _detL=useState(false),detailLoading=_detL[0],setDetailLoading=_detL[1];
  var _photoSrc=useState(null),photoSrc=_photoSrc[0],setPhotoSrc=_photoSrc[1];
  var _vidSrc=useState(null),vidSrc=_vidSrc[0],setVidSrc=_vidSrc[1];
  var _vidPlaying=useState(false),vidPlaying=_vidPlaying[0],setVidPlaying=_vidPlaying[1];

  var vRef=useRef(null),cRef=useRef(null),sRef=useRef(null);
  var vidElRef=useRef(null);
  var mRef=useRef(mode),subLRef=useRef(false),lRef=useRef(false),tRef=useRef(null),pRef=useRef(false);
  var autoStarted=useRef(false);

  useEffect(function(){mRef.current=mode;},[mode]);
  useEffect(function(){lRef.current=liveOn;},[liveOn]);
  useEffect(function(){subLRef.current=subLoading;},[subLoading]);
  useEffect(function(){pRef.current=paused;},[paused]);
  useEffect(function(){var iv=setInterval(function(){setTip(TIPS[Math.floor(Math.random()*TIPS.length)]);},5000);return function(){clearInterval(iv);};},[]);

  // Auto-start camera live
  useEffect(function(){
    if(camReady&&screen==="analyze"&&source==="cam"&&!autoStarted.current){autoStarted.current=true;goLive("cam");}
  },[camReady,screen,source]);

  // --- CAMERA ---
  var startCam=useCallback(function(face){setCamReady(false);setCamError(null);autoStarted.current=false;if(sRef.current){sRef.current.getTracks().forEach(function(t){t.stop();});sRef.current=null;}navigator.mediaDevices.getUserMedia({video:{facingMode:face||facing,width:{ideal:1280},height:{ideal:960}},audio:false}).then(function(st){sRef.current=st;if(vRef.current){vRef.current.srcObject=st;vRef.current.onloadedmetadata=function(){vRef.current.play().catch(function(){});setCamReady(true);};}}).catch(function(e){if(e.name==="NotAllowedError")setCamError("카메라 권한을 허용해주세요");else setCamError("카메라 오류: "+e.message);});},[facing]);
  var stopCam=useCallback(function(){if(sRef.current){sRef.current.getTracks().forEach(function(t){t.stop();});sRef.current=null;}setCamReady(false);},[]);
  var flipCam=useCallback(function(){var n=facing==="environment"?"user":"environment";setFacing(n);stopLive();autoStarted.current=false;startCam(n);},[facing,startCam]);
  useEffect(function(){return function(){if(sRef.current)sRef.current.getTracks().forEach(function(t){t.stop();});if(tRef.current)clearInterval(tRef.current);};},[]);

  // --- CAPTURE from cam or video element ---
  function capFrame(el){
    if(!el||!cRef.current)return null;
    var c=cRef.current;var sc=480/(el.videoWidth||el.width||480);
    c.width=480;c.height=Math.round((el.videoHeight||el.height||360)*sc);
    c.getContext("2d").drawImage(el,0,0,c.width,c.height);
    return c.toDataURL("image/jpeg",0.6).split(",")[1];
  }

  // --- 2-STAGE ANALYZE ---
  function doAnalyze(b64){
    var cur=mRef.current;if(!cur)return;
    setSubLoading(true);setError(null);setCnt(function(c){return c+1;});
    // Stage 1: fast subtitle
    callAPI({model:"claude-sonnet-4-20250514",max_tokens:80,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},{type:"text",text:FAST[cur]}]}]}).then(function(d){
      if(d.error)throw new Error(d.error.message||JSON.stringify(d.error));
      var t=d.content?d.content.map(function(c){return c.text||"";}).join("\n"):"";
      var p=parseSub(t);setSubtitle(p.subtitle||"...");setMood(p.mood||"");
    }).catch(function(e){setError(e.message);}).finally(function(){setSubLoading(false);});
    // Stage 2: detail
    setDetailLoading(true);
    callAPI({model:"claude-sonnet-4-20250514",max_tokens:800,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},{type:"text",text:DETAIL[cur]}]}]}).then(function(d){

      var m=MODES.find(function(x){return x.id===cur;});

    }).catch(function(){}).finally(function(){setDetailLoading(false);});
  }

  function goLive(type){
    setLiveOn(true);setPaused(false);

    if(type==="cam"&&vRef.current){var b=capFrame(vRef.current);if(b)doAnalyze(b);}

  function onVidPlay(){setVidPlaying(true);goLive("video");}

  var sm=MODES.find(function(x){return x.id===mode;});

  // --- HISTORY DETAIL ---
  if(viewItem)return html`<div style=${S.shell}><div style=${S.topBar}><button style=${S.topBtn} onClick=${function(){setViewItem(null);}}>← 뒤로</button><span style=${S.topTitle}>${viewItem.icon} ${viewItem.mode}</span><span style=${{width:56}}/></div><div style=${S.scroll}>${viewItem.subtitle&&html`<div class="subtitle-bar"><div class="subtitle-text">🐱 "${viewItem.subtitle}"</div></div>`}<div style=${{padding:"10px 20px 4px",color:"#777",fontSize:11}}>${viewItem.time}</div><${ResultText} text=${viewItem.result}/></div></div>`;

  if(screen==="history")return html`<div style=${S.shell}><div style=${S.topBar}><button style=${S.topBtn} onClick=${goHome}>← 홈</button><span style=${S.topTitle}>📋 분석 기록</span><span style=${{width:56}}/></div><div style=${S.scroll}><div style=${{padding:16}}>${history.length===0?html`<div style=${{textAlign:"center",paddingTop:60}}><div style=${{fontSize:52}}>📭</div><p style=${{color:"#888",marginTop:14}}>아직 기록이 없어요</p></div>`:history.map(function(h){return html`<button key=${h.id} style=${S.hItem} onClick=${function(){setViewItem(h);}}><div style=${{display:"flex",alignItems:"center",gap:12}}><div style=${{flex:1,minWidth:0}}><div style=${{color:"#eee",fontSize:13,fontWeight:700}}>${h.icon} ${h.mode}</div>${h.subtitle&&html`<div style=${{color:"#FFD700",fontSize:11,marginTop:2}}>"${h.subtitle.slice(0,35)}${h.subtitle.length>35?"...":""}"</div>`}<div style=${{color:"#777",fontSize:10,marginTop:2}}>${h.time}</div></div><span style=${{color:"#555"}}>›</span></div></button>`;})}</div></div></div>`;

  // --- HOME ---
  if(screen==="home")return html`<div style=${S.shell}><div style=${S.home}><div class="paw p1">🐾</div><div class="paw p2">🐾</div><div class="paw p3">🐾</div><div style=${S.logoWrap}><div style=${S.logoCircle}><span style=${{fontSize:50}}>🐱</span></div><h1 style=${{fontSize:25,fontWeight:900,color:"#f0f0f5"}}>냥냥 행동분석</h1><p style=${{fontSize:12,color:"#8888aa",marginTop:4}}>AI 고양이 행동교정 전문가</p><p style=${{fontSize:11,color:"#4ECDC4",marginTop:6}}>✨ 카메라 · 사진 · 영상 모두 분석!</p></div><div style=${S.tipBox}><span>💡</span><span style=${{color:"#ccd",fontSize:12,lineHeight:1.5}}>${tip}</span></div><div style=${{width:"100%",display:"flex",flexDirection:"column",gap:10}}>${MODES.map(function(m,i){return html`<button key=${m.id} class="card-anim" style=${{...S.modeCard,borderLeft:"4px solid "+m.color,animationDelay:i*.08+"s"}} onClick=${function(){enterMode(m.id);}}><div style=${{display:"flex",alignItems:"center",gap:14}}><span style=${{fontSize:34}}>${m.icon}</span><div><div style=${{fontSize:15,fontWeight:700,color:m.color}}>${m.label}</div><div style=${{fontSize:11,color:"#888",marginTop:2}}>${m.desc}</div></div></div><span style=${{fontSize:20,color:"#555"}}>›</span></button>`;})}</div><button style=${S.histBtn} onClick=${function(){setScreen("history");}}>📋 분석 기록 (${history.length})</button><div style=${{marginTop:"auto",paddingTop:20,textAlign:"center"}}><span style=${{fontSize:10,color:"#666"}}>AI 분석은 참고용이며 수의사 상담을 대체하지 않습니다</span></div></div></div>`;

  // --- SOURCE SELECTION ---
  if(screen==="source")return html`<div style=${S.shell}><div style=${{...S.topBar,background:sm?sm.color:"#333"}}><button style=${S.topBtn} onClick=${goHome}>← 홈</button><span style=${S.topTitle}>${sm?sm.icon:""} ${sm?sm.label:""}</span><span style=${{width:56}}/></div><div style=${S.scroll}><div style=${{padding:"30px 20px",animation:"fadeUp .5s ease-out"}}>
    <p style=${{color:"#eee",fontSize:16,fontWeight:700,textAlign:"center",marginBottom:6}}>분석할 소스를 선택하세요</p>
    <p style=${{color:"#888",fontSize:12,textAlign:"center",marginBottom:24}}>실시간 카메라, 저장된 사진, 녹화 영상 모두 가능!</p>
    <div style=${{display:"flex",gap:10,marginBottom:14}}>
      <button class="src-btn" style=${{borderColor:sm?sm.color+"44":"#333"}} onClick=${function(){pickSource("cam");}}>
        <span style=${{fontSize:36}}>📷</span>
        <span style=${{fontWeight:700,color:sm?sm.color:"#4ECDC4"}}>실시간 카메라</span>
        <span style=${{fontSize:10,color:"#888"}}>3초마다 자동 분석</span>
      </button>
    </div>
    <div style=${{display:"flex",gap:10}}>
      <div class="src-btn" style=${{borderColor:"rgba(255,255,255,.12)"}}>
        <span style=${{fontSize:36}}>🖼️</span>
        <span style=${{fontWeight:700,color:"#FFD700"}}>사진 불러오기</span>
        <span style=${{fontSize:10,color:"#888"}}>갤러리에서 선택</span>
        <input type="file" accept="image/*" onChange=${onPhoto}/>
      </div>
      <div class="src-btn" style=${{borderColor:"rgba(255,255,255,.12)"}}>
        <span style=${{fontSize:36}}>🎬</span>
        <span style=${{fontWeight:700,color:"#a29bfe"}}>영상 불러오기</span>
        <span style=${{fontSize:10,color:"#888"}}>녹화 영상 분석</span>
        <input type="file" accept="video/*" onChange=${onVideo}/>
      </div>
    </div>
  </div></div></div>`;

  // --- ANALYSIS SCREEN ---
  var clr=sm?sm.color:"#4ECDC4";
  return html`<div style=${S.shell}><div style=${{...S.topBar,background:clr}}><button style=${S.topBtn} onClick=${goHome}>← 홈</button><span style=${S.topTitle}>${sm?sm.icon:""} ${sm?sm.label:""} ${source==="photo"?"(사진)":source==="video"?"(영상)":"(실시간)"}</span>${source==="cam"?html`<button style=${S.topBtn} onClick=${flipCam}>🔄</button>`:html`<span style=${{width:56}}/>`}</div><div style=${S.scroll}>

    <!-- CAMERA -->
    ${source==="cam"&&html`<div style=${S.camWrap}><video ref=${vRef} autoPlay playsInline muted style=${S.video}/><canvas ref=${cRef} style=${{display:"none"}}/>${!camReady&&!camError&&html`<div style=${S.camOverlay}><div class="spinner"/><p style=${{color:"#fff",marginTop:12,fontSize:14}}>카메라 시작 중...</p></div>`}${camError&&html`<div style=${S.camOverlay}><span style=${{fontSize:40}}>📷</span><p style=${{color:"#ff7070",marginTop:12,fontSize:13,textAlign:"center",whiteSpace:"pre-line",lineHeight:1.6,padding:"0 24px"}}>${camError}</p></div>`}${camReady&&liveOn&&html`<div class="scan-line"/>`}${camReady&&liveOn&&html`<div style=${{position:"absolute",bottom:0,left:0,right:0,padding:"10px 16px 14px",background:"linear-gradient(transparent,rgba(0,0,0,.6))",zIndex:5,display:"flex",justifyContent:"center",gap:12}}><button style=${{padding:"10px 22px",borderRadius:50,color:"#fff",background:paused?"#4ECDC4":"rgba(255,255,255,.2)",fontSize:13,fontWeight:700}} onClick=${function(){setPaused(function(p){return !p;});}}>${paused?"▶️ 재개":"⏸️ 일시정지"}</button><button style=${{padding:"10px 22px",borderRadius:50,color:"#fff",background:"rgba(255,70,70,.6)",fontSize:13,fontWeight:700}} onClick=${stopLive}>⏹️ 중지</button></div>`}</div>`}

    <!-- PHOTO -->
    ${source==="photo"&&photoSrc&&html`<div style=${{position:"relative"}}><img src=${photoSrc} style=${{width:"100%",maxHeight:360,objectFit:"contain",background:"#000",display:"block"}}/><canvas ref=${cRef} style=${{display:"none"}}/></div>`}

    <!-- VIDEO -->
    ${source==="video"&&vidSrc&&html`<div style=${{position:"relative"}}><video ref=${vidElRef} src=${vidSrc} controls playsInline onPlay=${onVidPlay} onPause=${onVidPause} onEnded=${onVidEnd} style=${{width:"100%",maxHeight:400,background:"#000",display:"block"}}/><canvas ref=${cRef} style=${{display:"none"}}/>${vidPlaying&&liveOn&&html`<div class="scan-line"/>`}</div>`}

    <!-- SUBTITLE -->
    ${subtitle&&html`<div class="subtitle-bar" key=${cnt}><div class="subtitle-text">🐱 "${subtitle}"</div>${mood&&html`<div class="subtitle-mood">${mood}</div>`}</div>`}
    ${subLoading&&!subtitle&&html`<div class="subtitle-bar"><div style=${{display:"flex",alignItems:"center",justifyContent:"center",gap:8}}><div class="spinner-sm"/><span style=${{color:"#FFD700",fontSize:13}}>통역 중...</span></div></div>`}

    <!-- LIVE STATUS -->
    ${liveOn&&html`<div style=${S.liveBar}><div class="live-dot"/><span style=${{color:"#ff6666",fontSize:12,fontWeight:700}}>${source==="video"?"VIDEO":"LIVE"}</span><span style=${{color:"#999",fontSize:11}}>3초 자동</span><span style=${{marginLeft:"auto",color:"#4ECDC4",fontSize:11,fontWeight:600}}>분석 ${cnt}회</span>${subLoading&&html`<div class="spinner-sm"/>`}</div><div class="progress-track"><div class="progress-fill" style=${{background:clr}} key=${cnt}/></div>`}

    ${source==="photo"&&!subLoading&&!subtitle&&html`<div style=${{padding:"40px 20px",textAlign:"center"}}><div class="spinner"/><p style=${{color:"#888",marginTop:16,fontSize:13}}>사진 분석 중...</p></div>`}
    ${paused&&liveOn&&html`<div style=${{padding:"10px 16px",background:"rgba(255,200,50,.08)",display:"flex",alignItems:"center",gap:8}}><span>⏸️</span><span style=${{color:"#ffc832",fontSize:12}}>일시정지 중</span></div>`}
    ${error&&html`<div style=${S.errBox}><span>⚠️ ${error}</span></div>`}

    <!-- DETAIL -->
    ${detailLoading&&!detail&&html`<div style=${{padding:20,textAlign:"center",display:"flex",alignItems:"center",justifyContent:"center",gap:8,color:"#888",fontSize:12}}><div class="spinner-sm"/>상세 분석 로딩 중...</div>`}
    ${detail&&html`<div class="fade-in" key=${cnt}><div style=${{display:"flex",alignItems:"center",gap:8,padding:"14px 18px 4px"}}><span style=${{fontSize:18}}>${sm?sm.icon:""}</span><span style=${{color:"#f0f0f5",fontSize:15,fontWeight:700}}>상세 분석</span>${detailLoading&&html`<div class="spinner-sm" style=${{marginLeft:8}}/>`}</div><${ResultText} text=${detail}/></div>`}

    <!-- PHOTO: re-analyze or new -->
    ${source==="photo"&&!subLoading&&subtitle&&html`<div style=${{padding:"4px 20px 20px",display:"flex",gap:10}}>
      <div class="src-btn" style=${{borderColor:clr+"44",padding:"14px 10px"}}>
        <span>🖼️ 다른 사진 분석</span>
        <input type="file" accept="image/*" onChange=${onPhoto}/>
      </div>
    </div>`}

    <!-- VIDEO: instruction -->
    ${source==="video"&&!vidPlaying&&!liveOn&&vidSrc&&html`<div style=${{padding:"20px",textAlign:"center"}}><p style=${{color:"#888",fontSize:13}}>▶️ 영상을 재생하면 3초마다 자동 분석합니다</p></div>`}

    ${!subtitle&&!subLoading&&!error&&source==="cam"&&liveOn&&html`<div style=${{padding:"40px 20px",textAlign:"center"}}><div class="spinner"/><p style=${{color:"#888",marginTop:16,fontSize:13}}>첫 분석 준비 중...</p></div>`}
  </div></div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
