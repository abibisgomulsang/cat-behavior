function matchToy(moodText){
  var text=(moodText||"").toLowerCase();
  var keywords={bored:["심심","지루","무료"],hunting:["사냥","잡고","쫓"],playful:["놀","재미","장난"],anxious:["불안","긴장","무서"],stressed:["스트레스","짜증","예민"],hungry:["배고","밥","간식","먹"],curious:["호기심","궁금","탐색"],relaxed:["편안","이완","졸","쉬"],hiding:["숨","은신"],scratching:["긁","스크래치"],energetic:["활발","에너지","뛰"]};
  var scores={};
  TOYS.forEach(function(toy){scores[toy.id]=0;toy.mood.forEach(function(m){var kws=keywords[m]||[];kws.forEach(function(k){if(text.indexOf(k)>=0)scores[toy.id]+=2;});});});

}

/* ========== AUDIO ANALYZER ========== */
var audioCtx=null,analyser=null,micStream=null;
function startMic(){
  return navigator.mediaDevices.getUserMedia({audio:true}).then(function(stream){
    micStream=stream;
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    analyser=audioCtx.createAnalyser();
    analyser.fftSize=2048;
    audioCtx.createMediaStreamSource(stream).connect(analyser);
    return true;
  }).catch(function(){return false;});
}
function stopMic(){
  if(micStream){micStream.getTracks().forEach(function(t){t.stop();});micStream=null;}
  if(audioCtx){audioCtx.close();audioCtx=null;analyser=null;}
}
function getAudioDesc(){
  if(!analyser)return"마이크 없음";
  var data=new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(data);
  var sum=0,peak=0,peakIdx=0;
  for(var i=0;i<data.length;i++){sum+=data[i];if(data[i]>peak){peak=data[i];peakIdx=i;}}
  var avg=sum/data.length;
  var peakHz=Math.round(peakIdx*audioCtx.sampleRate/analyser.fftSize);
  // Cat meow range: 500-2000Hz
  var catRange=0;
  var lo=Math.floor(500*analyser.fftSize/audioCtx.sampleRate);
  var hi=Math.ceil(2000*analyser.fftSize/audioCtx.sampleRate);
  for(var j=lo;j<=hi&&j<data.length;j++)catRange+=data[j];
  catRange=catRange/(hi-lo+1);
  var desc="";
  if(avg<10)desc="주변이 조용합니다. 고양이 울음소리가 감지되지 않습니다.";
  else if(catRange>50&&peakHz>=400&&peakHz<=2500)desc="고양이 울음소리 감지! 주파수:"+peakHz+"Hz, 볼륨:"+Math.round(catRange)+"/255. "+(peakHz<800?"낮고 길게 우는 소리(불만/요구)":peakHz<1200?"보통 높이의 야옹(인사/관심요구)":"높고 짧은 소리(흥분/긴급)");
  else if(avg>30)desc="배경 소음 감지(볼륨:"+Math.round(avg)+"). 고양이 울음소리 대역(500-2000Hz)에서 뚜렷한 신호 없음.";
  else desc="약한 소리 감지. 고양이 울음소리 여부 불확실.";
  return desc;
}

  // ANALYSIS
  var clr=sm?sm.color:"#4ECDC4";
  return html`<div style=${S.shell}><div style=${{...S.topBar,background:clr}}><button style=${S.topBtn} onClick=${goHome}>← 홈</button><span style=${S.topTitle}>${sm?sm.icon:""} ${sm?sm.label:""}</span>
    ${source==="cam"?html`<div style=${{display:"flex",gap:6}}><button style=${{...S.topBtn,background:micOn?"rgba(255,68,68,.4)":"rgba(255,255,255,.18)"}} class=${micOn?"mic-active":""} onClick=${toggleMic}>${micOn?"🎤":"🔇"}</button><button style=${S.topBtn} onClick=${flipCam}>🔄</button></div>`:html`<span style=${{width:56}}/>`}
  </div><div style=${S.scroll}>

    <!-- CAM -->
    ${source==="cam"&&html`<div style=${S.camWrap}><video ref=${vRef} autoPlay playsInline muted style=${S.video}/><canvas ref=${cRef} style=${{display:"none"}}/>${!camReady&&!camError&&!stopped&&html`<div style=${S.camOverlay}><div class="spinner"/><p style=${{color:"#fff",marginTop:12,fontSize:14}}>카메라 시작 중...</p></div>`}${stopped&&html`<div style=${S.camOverlay}><span style=${{fontSize:40}}>✅</span><p style=${{color:"#4ECDC4",marginTop:12,fontSize:14,fontWeight:700}}>분석 종료</p></div>`}${camError&&!stopped&&html`<div style=${S.camOverlay}><span style=${{fontSize:40}}>📷</span><p style=${{color:"#ff7070",marginTop:12,fontSize:13,textAlign:"center",whiteSpace:"pre-line"}}>${camError}</p></div>`}${camReady&&liveOn&&html`<div class="scan-line"/>`}${camReady&&liveOn&&html`<div style=${{position:"absolute",bottom:0,left:0,right:0,padding:"10px 16px 14px",background:"linear-gradient(transparent,rgba(0,0,0,.6))",zIndex:5,display:"flex",justifyContent:"center",gap:12}}><button style=${{padding:"10px 22px",borderRadius:50,color:"#fff",background:paused?"#4ECDC4":"rgba(255,255,255,.2)",fontSize:13,fontWeight:700}} onClick=${function(){setPaused(function(p){return !p;});}}>${paused?"▶️ 재개":"⏸️ 일시정지"}</button><button style=${{padding:"10px 22px",borderRadius:50,color:"#fff",background:"rgba(255,70,70,.6)",fontSize:13,fontWeight:700}} onClick=${fullStop}>⏹️ 중지</button></div>`}</div>`}
    <!-- MIC STATUS -->
    ${source==="cam"&&micOn&&html`<div style=${{display:"flex",alignItems:"center",gap:8,padding:"8px 16px",background:"rgba(255,68,68,.08)",borderBottom:"1px solid rgba(255,68,68,.12)",fontSize:12}}><span class="mic-active" style=${{width:8,height:8,borderRadius:4,background:"#ff4444",flexShrink:0}}></span><span style=${{color:"#ff6666",fontWeight:700}}>MIC ON</span><span style=${{color:"#999"}}>울음소리 감지 중</span></div>`}
    <!-- PHOTO -->
    ${source==="photo"&&photoSrc&&html`<div><img src=${photoSrc} style=${{width:"100%",maxHeight:360,objectFit:"contain",background:"#000"}}/><canvas ref=${cRef} style=${{display:"none"}}/></div>`}
    <!-- VIDEO -->
    ${source==="video"&&vidSrc&&html`<div style=${{position:"relative"}}><video ref=${vidElRef} src=${vidSrc} controls playsInline onLoadedData=${onVidLoaded} onError=${function(){setVidLoad(false);setError("MP4 형식을 사용해주세요");}} onPlay=${onVidPlay} onPause=${onVidPause} onEnded=${onVidPause} style=${{width:"100%",maxHeight:400,background:"#000"}}/><canvas ref=${cRef} style=${{display:"none"}}/></div>`}
    ${source==="video"&&vidInfo&&html`<div style=${{display:"flex",alignItems:"center",gap:8,padding:"8px 16px",background:"rgba(78,205,196,.06)",borderBottom:"1px solid rgba(78,205,196,.1)",fontSize:12,color:"#4ECDC4",flexWrap:"wrap"}}><span>🎬 ${(vidInfo.name||"").slice(0,20)}</span><span>📦 ${vidInfo.size}</span>${vidInfo.duration&&html`<span>⏱️ ${vidInfo.duration}</span>`}${vidPlay&&html`<span style=${{color:"#ff6666",fontWeight:700}}>● 분석중</span>`}</div>`}
    ${source==="video"&&vidLoad&&!vidReady&&html`<div style=${{padding:30,textAlign:"center"}}><div class="spinner" style=${{margin:"0 auto"}}/><p style=${{color:"#888",marginTop:12,fontSize:13}}>영상 로딩 중...</p></div>`}
    ${source==="video"&&vidReady&&!vidPlay&&!liveOn&&html`<div style=${{padding:24,textAlign:"center"}}><div style=${{fontSize:32,animation:"bounce 1.5s ease-in-out infinite"}}>👆</div><p style=${{color:"#a29bfe",fontSize:15,fontWeight:800,marginTop:8}}>▶ 재생 버튼을 눌러주세요!</p><p style=${{color:"#888",fontSize:12,marginTop:6}}>재생하면 3초마다 자동 분석</p></div>`}

    <!-- SUBTITLE -->
    ${subtitle&&html`<div class="subtitle-bar" key=${cnt}><div class="subtitle-text">🐱 "${subtitle}"</div>${mood&&html`<div class="subtitle-mood">${mood}</div>`}</div>`}
    ${subL&&!subtitle&&html`<div class="subtitle-bar"><div style=${{display:"flex",alignItems:"center",justifyContent:"center",gap:8}}><div class="spinner-sm"/><span style=${{color:"#FFD700",fontSize:13}}>${micOn?"음성+영상 통합 분석 중...":"정밀 통역 중..."}</span></div></div>`}

    <!-- FEEDBACK BUTTONS -->
    ${subtitle&&!subL&&html`<div style=${{display:"flex",gap:10,padding:"10px 18px",borderBottom:"1px solid rgba(255,255,255,.04)"}}>
      ${fbSent?html`<div style=${{flex:1,textAlign:"center",color:"#4ECDC4",fontSize:12,padding:8}}>✅ 피드백 반영됨! 다음 분석에 적용됩니다</div>`
      :html`<${React.Fragment}><button class="fb-btn" style=${{background:"rgba(78,205,196,.1)",color:"#4ECDC4"}} onClick=${function(){onFeedback(true);}}>👍 맞아요</button><button class="fb-btn" style=${{background:"rgba(255,80,80,.1)",color:"#ff7070"}} onClick=${function(){onFeedback(false);}}>👎 틀려요</button></$>`}
    </div>`}

    <!-- TOY RECOMMENDATION -->
    ${recToy&&subtitle&&html`<div class="toy-card">
      <div style=${{display:"flex",alignItems:"center",gap:10,marginBottom:10}}><span style=${{fontSize:11,color:"#FF6B6B",fontWeight:700,background:"rgba(255,107,107,.1)",padding:"3px 8px",borderRadius:6}}>🧸 추천 장난감</span><span style=${{fontSize:10,color:"#888"}}>아비비 고물상</span></div>
      <div style=${{display:"flex",alignItems:"center",gap:14}}>
        <div style=${{width:56,height:56,borderRadius:12,background:"rgba(255,255,255,.06)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:28,flexShrink:0}}>${recToy.emoji}</div>
        <div style=${{flex:1}}>
          <div style=${{color:"#eee",fontSize:14,fontWeight:700}}>${recToy.name}</div>
          <div style=${{color:"#888",fontSize:11,marginTop:2}}>${recToy.desc}</div>
          <div style=${{display:"flex",alignItems:"center",gap:8,marginTop:6}}>
            <span style=${{color:"#FFD700",fontSize:13,fontWeight:700}}>${recToy.price}</span>
            <span style=${{fontSize:10,color:"#666",background:"rgba(255,255,255,.06)",padding:"2px 6px",borderRadius:4}}>${recToy.tag}</span>
          </div>
        </div>
      </div>
    </div>`}

    <!-- LIVE STATUS -->
    ${liveOn&&html`<div style=${S.liveBar}><div class="live-dot"/><span style=${{color:"#ff6666",fontSize:12,fontWeight:700}}>${source==="video"?"VIDEO":"LIVE"}</span>${micOn&&html`<span style=${{color:"#ff6666",fontSize:10}}>🎤</span>`}<span style=${{color:"#999",fontSize:11}}>3초</span><span style=${{marginLeft:"auto",color:"#4ECDC4",fontSize:11,fontWeight:600}}>분석 ${cnt}회</span>${subL&&html`<div class="spinner-sm"/>`}</div><div class="progress-track"><div class="progress-fill" style=${{background:clr}} key=${cnt}/></div>`}

    ${source==="photo"&&subL&&!subtitle&&html`<div style=${{padding:40,textAlign:"center"}}><div class="spinner" style=${{margin:"0 auto"}}/><p style=${{color:"#888",marginTop:16,fontSize:13}}>사진 분석 중...</p></div>`}
    ${paused&&liveOn&&html`<div style=${{padding:"10px 16px",background:"rgba(255,200,50,.08)",display:"flex",alignItems:"center",gap:8}}><span>⏸️</span><span style=${{color:"#ffc832",fontSize:12}}>일시정지 중</span></div>`}
    ${error&&html`<div style=${S.errBox}>⚠️ ${error}</div>`}

    <!-- DETAIL -->
    ${detL&&!detail&&html`<div style=${{padding:20,textAlign:"center",display:"flex",alignItems:"center",justifyContent:"center",gap:8,color:"#888",fontSize:12}}><div class="spinner-sm"/>상세 분석 로딩 중...</div>`}
    ${detail&&html`<div class="fade-in" key=${cnt}><div style=${{display:"flex",alignItems:"center",gap:8,padding:"14px 18px 4px"}}><span style=${{fontSize:18}}>${sm?sm.icon:""}</span><span style=${{color:"#f0f0f5",fontSize:15,fontWeight:700}}>상세 분석</span></div><${Txt} text=${detail}/></div>`}

    ${source==="photo"&&!subL&&subtitle&&html`<div style=${{padding:"4px 20px 20px",display:"flex",gap:10}}><div class="src-btn" style=${{borderColor:clr+"44",padding:"14px 10px"}}><span>🖼️ 다른 사진 분석</span><input type="file" accept="image/*" onChange=${onPhoto}/></div></div>`}
    ${!subtitle&&!subL&&!error&&source==="cam"&&liveOn&&html`<div style=${{padding:40,textAlign:"center"}}><div class="spinner" style=${{margin:"0 auto"}}/><p style=${{color:"#888",marginTop:16,fontSize:13}}>첫 분석 준비 중...</p></div>`}

    <!-- STOPPED STATE: 분석 완료 -->
    ${stopped&&!subL&&!detL&&html`<div style=${{padding:"16px 18px",animation:"fadeUp .4s ease-out"}}>
      <div style=${{background:"rgba(78,205,196,.06)",border:"1px solid rgba(78,205,196,.12)",borderRadius:12,padding:"14px 16px",textAlign:"center",marginBottom:14}}>
        <div style=${{color:"#4ECDC4",fontSize:14,fontWeight:700,marginBottom:4}}>✅ 분석 완료</div>
        <div style=${{color:"#888",fontSize:12}}>총 ${cnt}회 분석 | ${source==="cam"?"실시간 카메라":source==="video"?"영상 분석":"사진 분석"}</div>
      </div>
      <div style=${{display:"flex",gap:10}}>
        <button style=${{flex:1,padding:"14px",borderRadius:12,background:"rgba(255,255,255,.06)",border:"1px solid rgba(255,255,255,.08)",color:"#aaa",fontSize:13,fontWeight:700}} onClick=${goHome}>🏠 홈으로</button>
        <button style=${{flex:1,padding:"14px",borderRadius:12,background:clr+"22",border:"1px solid "+clr+"44",color:clr,fontSize:13,fontWeight:700}} onClick=${function(){resetAll();setSource(null);setScreen("source");}}>🔄 다시 분석</button>
      </div>
    </div>`}
    ${stopped&&(subL||detL)&&html`<div style=${{padding:"14px 18px",display:"flex",alignItems:"center",justifyContent:"center",gap:8,color:"#4ECDC4",fontSize:12}}><div class="spinner-sm"/>마지막 분석 마무리 중...</div>`}
  </div></div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
} // end else (library check)
</script>
</body>
</html>
