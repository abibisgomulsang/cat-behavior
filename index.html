<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">

<title>냥냥 행동분석</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;font-family:'Noto Sans KR',sans-serif;-webkit-tap-highlight-color:transparent}
html,body,#root{width:100%;min-height:100dvh;background:#111119;overflow-x:hidden}
button{border:none;background:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes recPulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(255,68,68,.4)}50%{opacity:.7;box-shadow:0 0 0 12px rgba(255,68,68,0)}}
@keyframes dots{0%{content:''}33%{content:'.'}66%{content:'..'}100%{content:'...'}}
@keyframes checkPop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes gentlePulse{0%,100%{opacity:.6}50%{opacity:1}}
@keyframes catWalk{0%{transform:translateX(-30px)}50%{transform:translateX(30px)}100%{transform:translateX(-30px)}}
.spinner{width:50px;height:50px;border:3px solid rgba(255,255,255,.15);border-top-color:#4ECDC4;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
.fade-in{animation:fadeUp .5s ease-out}
.rec-dot{width:14px;height:14px;border-radius:50%;background:#ff4444;animation:recPulse 1.5s ease-in-out infinite;flex-shrink:0}
.overlay{position:fixed;inset:0;background:linear-gradient(170deg,#0a0a18,#111130 40%,#0a1a35);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;padding:30px}
.overlay-cat{font-size:60px;animation:catWalk 3s ease-in-out infinite;margin-bottom:20px}
.overlay-title{color:#fff;font-size:20px;font-weight:800;margin-bottom:8px;text-align:center}
.overlay-sub{color:#888;font-size:13px;text-align:center;line-height:1.6}
.overlay-dots::after{content:'';animation:dots 1.5s steps(4) infinite}
.check-circle{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#4ECDC4,#44b8b0);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;animation:checkPop .5s ease-out}
.analysis-steps{display:flex;flex-direction:column;gap:12px;margin-top:24px;width:100%;max-width:280px}
.step-item{display:flex;align-items:center;gap:10px;font-size:12px;color:#666}
.step-item.active{color:#4ECDC4}
.step-item.done{color:#4ECDC4}
.step-dot{width:8px;height:8px;border-radius:50%;background:#333;flex-shrink:0}
.step-item.active .step-dot{background:#4ECDC4;animation:gentlePulse 1s ease-in-out infinite}
.step-item.done .step-dot{background:#4ECDC4}

/* ===== 놀이법 애니메이션 ===== */
.play-card{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:16px;margin-bottom:14px}
.play-scene{width:100%;height:140px;border-radius:12px;position:relative;overflow:hidden;margin:10px 0}

/* 장면1: 사냥/지그재그 - 갈색 바닥 + 깃털 불규칙 이동 + 고양이 추격 */
.scene-hunt{background:linear-gradient(180deg,#1a1520 0%,#2a1f15 70%,#3d2f1e 100%)}
@keyframes huntToy{0%{left:15%;top:25%}20%{left:65%;top:15%}40%{left:30%;top:45%}60%{left:70%;top:30%}80%{left:20%;top:20%}100%{left:15%;top:25%}}
@keyframes huntCat{0%{left:20%;top:60%}20%{left:60%;top:55%}40%{left:35%;top:65%}60%{left:65%;top:58%}80%{left:25%;top:62%}100%{left:20%;top:60%}}
@keyframes huntPaw{0%,80%{opacity:0;transform:scale(.5)}85%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(.5)}}
@keyframes huntTrail{0%{opacity:.6}100%{opacity:0}}
.scene-hunt .toy{position:absolute;font-size:24px;animation:huntToy 4s ease-in-out infinite}
.scene-hunt .cat{position:absolute;font-size:28px;animation:huntCat 4s ease-in-out infinite .3s}
.scene-hunt .paw{position:absolute;font-size:16px;right:30%;top:35%;animation:huntPaw 4s ease-in-out infinite 2.5s}
.scene-hunt .trail{position:absolute;width:4px;height:4px;border-radius:50%;background:#FF6B6B}
.scene-hunt .t1{left:40%;top:30%;animation:huntTrail 2s infinite .5s}
.scene-hunt .t2{left:55%;top:25%;animation:huntTrail 2s infinite 1s}
.scene-hunt .t3{left:25%;top:40%;animation:huntTrail 2s infinite 1.5s}
.scene-hunt .arrow{position:absolute;color:rgba(255,107,107,.3);font-size:10px;top:10px;right:10px}

/* 장면2: 낚시/위아래 - 하늘색 배경 + 낚싯대 위아래 + 고양이 점프 */
.scene-fish{background:linear-gradient(180deg,#151525 0%,#1a2030 60%,#252520 100%)}
@keyframes fishRod{0%{transform:rotate(-15deg)}50%{transform:rotate(15deg)}100%{transform:rotate(-15deg)}}
@keyframes fishToy{0%{top:35%;transform:rotate(0)}30%{top:15%;transform:rotate(20deg)}60%{top:40%;transform:rotate(-10deg)}100%{top:35%;transform:rotate(0)}}
@keyframes fishCat{0%{bottom:8px;transform:scaleY(1)}40%{bottom:8px;transform:scaleY(.85)}50%{bottom:45px;transform:scaleY(1.1)}70%{bottom:8px;transform:scaleY(.9)}100%{bottom:8px;transform:scaleY(1)}}
@keyframes fishHand{0%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-8px) rotate(5deg)}100%{transform:translateY(0) rotate(-5deg)}}
.scene-fish .rod{position:absolute;left:25%;top:5px;font-size:12px;transform-origin:bottom center;animation:fishHand 2s ease-in-out infinite;color:#999}
.scene-fish .toy{position:absolute;left:55%;font-size:22px;animation:fishToy 2s ease-in-out infinite}
.scene-fish .cat{position:absolute;left:50%;font-size:28px;transform:translateX(-50%);animation:fishCat 2s ease-in-out infinite}
.scene-fish .line{position:absolute;left:32%;top:12px;width:1px;height:40px;background:rgba(255,255,255,.15);transform-origin:top;animation:fishRod 2s ease-in-out infinite}

/* 장면3: 숨바꼭질 - 이불/상자 뒤에 숨기 */
.scene-hide{background:linear-gradient(180deg,#1a1525 0%,#201a28 60%,#2a2520 100%)}
@keyframes hideToy{0%{left:60%;opacity:1;transform:scale(1)}25%{left:48%;opacity:1;transform:scale(.9)}35%{left:42%;opacity:0;transform:scale(.4)}65%{left:42%;opacity:0;transform:scale(.4)}75%{left:48%;opacity:.5;transform:scale(.7)}85%{left:55%;opacity:1;transform:scale(1.1)}100%{left:60%;opacity:1;transform:scale(1)}}
@keyframes hideCat{0%{transform:translateX(0) scale(1)}30%{transform:translateX(15px) scale(1.05)}60%{transform:translateX(-5px) scale(.95)}75%{transform:translateX(20px) scale(1.15)}100%{transform:translateX(0) scale(1)}}
@keyframes hideEyes{0%,30%{opacity:0}35%,65%{opacity:1}70%,100%{opacity:0}}
@keyframes hideQ{0%,70%{opacity:0;transform:translateY(0)}75%{opacity:1;transform:translateY(-5px)}90%{opacity:1;transform:translateY(-8px)}100%{opacity:0;transform:translateY(-12px)}}
.scene-hide .box{position:absolute;left:30%;bottom:15px;font-size:36px}
.scene-hide .toy{position:absolute;top:35%;font-size:22px;animation:hideToy 4s ease-in-out infinite}
.scene-hide .cat{position:absolute;right:15%;bottom:12px;font-size:28px;animation:hideCat 4s ease-in-out infinite}
.scene-hide .eyes{position:absolute;left:38%;top:40%;font-size:14px;animation:hideEyes 4s ease-in-out infinite}
.scene-hide .qmark{position:absolute;right:18%;bottom:50px;font-size:16px;color:#FFD700;animation:hideQ 4s ease-in-out infinite}

/* 장면4: 굴리기 - 바닥 굴러가는 공 + 쫓아가는 고양이 */
.scene-roll{background:linear-gradient(180deg,#151520 0%,#1a1a28 60%,#252018 100%)}
@keyframes rollBall{0%{left:10%;transform:rotate(0)}50%{left:75%;transform:rotate(720deg)}100%{left:10%;transform:rotate(1440deg)}}
@keyframes rollCat{0%{left:5%}45%{left:60%}55%{left:65%;transform:scaleX(1)}60%{left:63%;transform:scaleX(-1)}100%{left:5%;transform:scaleX(-1)}}
@keyframes rollDust{0%{opacity:0;transform:scale(0)}50%{opacity:.4;transform:scale(1)}100%{opacity:0;transform:scale(1.5)}}
.scene-roll .ball{position:absolute;top:40%;font-size:24px;animation:rollBall 3s ease-in-out infinite}
.scene-roll .cat{position:absolute;bottom:12px;font-size:26px;animation:rollCat 3s ease-in-out infinite .2s}
.scene-roll .dust1{position:absolute;bottom:20px;left:20%;font-size:8px;color:#666;animation:rollDust 1.5s infinite .3s}
.scene-roll .dust2{position:absolute;bottom:25px;left:35%;font-size:6px;color:#555;animation:rollDust 1.5s infinite .8s}
.scene-roll .floor{position:absolute;bottom:0;left:0;right:0;height:2px;background:rgba(255,255,255,.08)}

/* 장면5: 추격/레이저 - 벽+바닥에 빨간 점 이동 */
.scene-chase{background:linear-gradient(180deg,#151520 0%,#181828 50%,#1a1a20 100%)}
@keyframes chaseDot{0%{left:20%;top:60%}20%{left:60%;top:30%}40%{left:75%;top:65%}60%{left:30%;top:25%}80%{left:55%;top:55%}100%{left:20%;top:60%}}
@keyframes chaseCat{0%{left:25%;top:65%}20%{left:55%;top:40%}40%{left:70%;top:68%}60%{left:35%;top:35%}80%{left:50%;top:58%}100%{left:25%;top:65%}}
@keyframes chaseGlow{0%,100%{box-shadow:0 0 8px 4px rgba(255,0,0,.3)}50%{box-shadow:0 0 15px 8px rgba(255,0,0,.5)}}
.scene-chase .dot{position:absolute;width:10px;height:10px;border-radius:50%;background:#ff3333;animation:chaseDot 4s ease-in-out infinite,chaseGlow 1s ease-in-out infinite}
.scene-chase .cat{position:absolute;font-size:24px;animation:chaseCat 4s ease-in-out infinite .2s}
.scene-chase .beam{position:absolute;top:5px;right:15px;font-size:14px;opacity:.3}
</style>
</head>

function getScene(action){
  var keys=Object.keys(SCENE_MAP);
  for(var i=0;i<keys.length;i++){if(action.indexOf(keys[i])>=0)return SCENE_MAP[keys[i]];}
  return"hunt";
}
function parsePlayMethods(text){
  var methods=[];
  for(var i=1;i<=3;i++){
    var tag="[놀이법"+i+"]";
    var idx=text.indexOf(tag);
    if(idx===-1)continue;
    var chunk=text.substring(idx+tag.length);
    var nextTag=chunk.indexOf("[놀이법");
    if(nextTag===-1){var safeEnd=chunk.indexOf("⚠️");if(safeEnd>0)chunk=chunk.substring(0,safeEnd);}
    else{chunk=chunk.substring(0,nextTag);}
    var title="",action="",desc="",time="";
    chunk.split("\n").forEach(function(line){
      line=line.trim();
      if(line.startsWith("제목:"))title=line.replace("제목:","").trim();
      else if(line.startsWith("동작:"))action=line.replace("동작:","").trim();
      else if(line.startsWith("설명:"))desc=line.replace("설명:","").trim();
      else if(line.startsWith("시간:"))time=line.replace("시간:","").trim();
    });
    if(title)methods.push({title:title,action:action,desc:desc,time:time});
  }
  return methods;
}
function removePlaySection(text){
  var idx=text.indexOf("[놀이법1]");
  if(idx===-1)return text;
  var before=text.substring(0,idx);
  var safeIdx=text.indexOf("⚠️",idx);
  var after=safeIdx>=0?text.substring(safeIdx):"";
  return(before+after).trim();
}

      stRef.current=s;if(vRef.current){vRef.current.srcObject=s;vRef.current.onloadedmetadata=function(){vRef.current.play();setCamOk(true);};}

  if(phase==="result"&&result)return h`<div style=${{maxWidth:520,margin:"0 auto",minHeight:"100dvh",background:"#111119",display:"flex",flexDirection:"column"}}>
    <div style=${{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",background:clr}}><button style=${{background:"rgba(255,255,255,.18)",color:"#fff",padding:"7px 14px",borderRadius:8,fontSize:12.5}} onClick=${goHome}>← 홈</button><span style=${{color:"#fff",fontSize:15,fontWeight:700}}>${sm.icon} ${sm.label} 결과</span><span style=${{width:56}}/></div>
    <div style=${{flex:1,overflowY:"auto",padding:"20px 18px",background:"linear-gradient(180deg,#13131f,#161630)"}} class="fade-in">

      <!-- 번역 모드: 번역기 스타일 헤더 -->
      ${mode==="behavior"?h`<div style=${{marginBottom:20}}>
        <div style=${{display:"flex",alignItems:"center",justifyContent:"center",gap:12,marginBottom:16}}>
          <div style=${{background:"rgba(78,205,196,.1)",border:"1px solid rgba(78,205,196,.2)",borderRadius:10,padding:"8px 16px",textAlign:"center"}}>
            <div style=${{fontSize:22}}>🐱</div>
            <div style=${{color:"#4ECDC4",fontSize:12,fontWeight:700,marginTop:2}}>고양이어</div>
          </div>
          <div style=${{color:"#4ECDC4",fontSize:20,fontWeight:900}}>→</div>
          <div style=${{background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.08)",borderRadius:10,padding:"8px 16px",textAlign:"center"}}>
            <div style=${{fontSize:22}}>🇰🇷</div>
            <div style=${{color:"#eee",fontSize:12,fontWeight:700,marginTop:2}}>한국어</div>
          </div>
        </div>
        <div style=${{background:"rgba(78,205,196,.06)",border:"1px solid rgba(78,205,196,.1)",borderRadius:12,padding:"12px 16px",textAlign:"center"}}>
          <span style=${{color:"#4ECDC4",fontSize:13,fontWeight:600}}>🔊 번역 완료</span>
          <span style=${{color:"#888",fontSize:11,marginLeft:8}}>꼬리 · 눈 · 귀 · 자세 언어 해독</span>
        </div>
      </div>`
      :h`<div style=${{display:"flex",alignItems:"center",gap:8,marginBottom:14}}><span style=${{fontSize:22}}>${sm.icon}</span><span style=${{color:"#f0f0f5",fontSize:17,fontWeight:800}}>분석 결과</span></div>`}

      ${error&&h`<div style=${{padding:14,background:"rgba(255,80,80,.12)",borderRadius:12,color:"#ff7070",fontSize:12,marginBottom:14}}>⚠️ ${error}</div>`}
      <div style=${{color:"#ccd",fontSize:13.5,lineHeight:1.8,whiteSpace:"pre-wrap"}}>${cleanResult}</div>

      <!-- 장난감 모드: 놀이법 애니메이션 카드 -->
      ${playMethods.length>0&&h`<div style=${{marginTop:20}}>
        <div style=${{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
          <span style=${{fontSize:18}}>🎮</span>
          <span style=${{color:"#FFD700",fontSize:16,fontWeight:800}}>놀이 방법 가이드</span>
        </div>
        ${playMethods.map(function(m,i){return h`<${PlayCard} key=${i} method=${m} index=${i}/>`;})}
      </div>`}

      <div style=${{marginTop:30,display:"flex",gap:10}}>
        <button style=${{flex:1,padding:14,borderRadius:12,background:"rgba(255,255,255,.06)",color:"#aaa",fontSize:13,fontWeight:700}} onClick=${goHome}>🏠 홈</button>
        <button style=${{flex:1,padding:14,borderRadius:12,background:clr+"22",border:"1px solid "+clr+"44",color:clr,fontSize:13,fontWeight:700}} onClick=${function(){setResult("");setPhase("idle");setError(null);collectedRef.current=[];setScr("record");setTimeout(function(){startCam(face);},100);}}>🔄 다시 촬영</button>
      </div>
    </div>
  </div>`;

  // 촬영 화면
  return h`<div style=${{maxWidth:520,margin:"0 auto",minHeight:"100dvh",background:"#111119",display:"flex",flexDirection:"column"}}>
    <div style=${{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",background:clr,position:"sticky",top:0,zIndex:10}}>
      <button style=${{background:"rgba(255,255,255,.18)",color:"#fff",padding:"7px 14px",borderRadius:8,fontSize:12.5}} onClick=${function(){cleanup();goHome();}}>← 홈</button>
      <span style=${{color:"#fff",fontSize:15,fontWeight:700}}>${sm?sm.icon:""} ${sm?sm.label:""}</span>
      ${!recording?h`<button style=${{background:"rgba(255,255,255,.18)",color:"#fff",padding:"7px 14px",borderRadius:8,fontSize:12.5}} onClick=${flipCam}>🔄</button>`:h`<span style=${{width:56}}/>`}
    </div>
    <div style=${{flex:1,background:"linear-gradient(180deg,#13131f,#161630)"}}>
      <div style=${{position:"relative",width:"100%",aspectRatio:"4/3",background:"#000",overflow:"hidden"}}>
        <video ref=${vRef} autoPlay playsInline muted style=${{width:"100%",height:"100%",objectFit:"cover"}}/>
        <canvas ref=${cRef} style=${{display:"none"}}/>
        ${!camOk&&h`<div style=${{position:"absolute",inset:0,background:"rgba(0,0,0,.8)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}><div class="spinner"/><p style=${{color:"#fff",marginTop:12}}>카메라 준비 중...</p></div>`}
        ${recording&&h`<div style=${{position:"absolute",top:12,left:12,display:"flex",alignItems:"center",gap:8,background:"rgba(0,0,0,.6)",padding:"6px 14px",borderRadius:20,zIndex:5}}><div class="rec-dot"/><span style=${{color:"#ff6666",fontSize:13,fontWeight:700}}>REC</span></div>`}
        ${recording&&h`<div style=${{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",zIndex:5}}>
          <svg width="120" height="120"><circle cx="60" cy="60" r="54" fill="rgba(0,0,0,.4)" stroke="rgba(255,255,255,.15)" stroke-width="4"/><circle cx="60" cy="60" r="54" fill="none" stroke=${clr} stroke-width="4" stroke-linecap="round" stroke-dasharray=${circ} stroke-dashoffset=${circ*(1-progress)} style=${{transition:"stroke-dashoffset 1s linear",transform:"rotate(-90deg)",transformOrigin:"center"}}/></svg>
          <div style=${{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column"}}><div style=${{color:"#fff",fontSize:32,fontWeight:900}}>${remain}</div><div style=${{color:"rgba(255,255,255,.6)",fontSize:11}}>초 남음</div></div>
        </div>`}
      </div>
      ${!recording&&camOk&&h`<div style=${{padding:"24px 20px",textAlign:"center"}}>
        <p style=${{color:"#eee",fontSize:15,fontWeight:700,marginBottom:6}}>${sm?sm.icon:""} ${sm?sm.label:""}</p>
        <p style=${{color:"#888",fontSize:12,marginBottom:20}}>${totalSec}초 동안 촬영합니다. 준비되면 시작!</p>
        <button style=${{padding:"18px 50px",borderRadius:50,background:clr,color:"#fff",fontSize:18,fontWeight:900,boxShadow:"0 4px 24px "+clr+"66"}} onClick=${startRec}>🎬 촬영 시작</button>
      </div>`}
      ${recording&&h`<div style=${{padding:"16px 20px",textAlign:"center"}}>
        <p style=${{color:"#ff6666",fontSize:13,fontWeight:700,marginBottom:12}}>📹 촬영 중... 분석을 위해 촬영하고 있어요</p>
        <button style=${{padding:"12px 36px",borderRadius:50,background:"rgba(255,70,70,.7)",color:"#fff",fontSize:13,fontWeight:700}} onClick=${stopRecEarly}>⏹️ 촬영 완료</button>
      </div>`}
    </div>
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(h`<${App}/>`);
} // end else
</script>
</body>
</html>
