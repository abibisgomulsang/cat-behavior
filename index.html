function scoreToy(toy,moodText){
  var text=(moodText||"").toLowerCase();
  var score=0;
  Object.keys(toy.weights).forEach(function(mood){
    var kws=MOOD_KEYWORDS[mood]||[];
    kws.forEach(function(kw){
      if(text.indexOf(kw)>=0) score+=toy.weights[mood];
    });
  });
  return score;
}
function bestToy(moodText){
  var best=TOYS[0],bestScore=0;
  TOYS.forEach(function(t){
    var s=scoreToy(t,moodText);
    if(s>bestScore){bestScore=s;best=t;}
  });
  return bestScore>0?best:TOYS[Math.floor(Math.random()*TOYS.length)];
}

function personalitySummary(){
  if(catDB.feedbacks.length<2)return"";
  var recent=catDB.feedbacks.slice(-5);
  var emotions={},wants={};
  recent.forEach(function(f){
    var m=(f.mood||"").toLowerCase();

    });

      if(m.indexOf(w)>=0||f.sub.indexOf(w)>=0){wants[w]=(wants[w]||0)+1;}
    });
  });
  var topEmo=Object.entries(emotions).sort(function(a,b){return b[1]-a[1];}).slice(0,3).map(function(e){return e[0];});
  var topWant=Object.entries(wants).sort(function(a,b){return b[1]-a[1];}).slice(0,2).map(function(e){return e[0];});
  var lines=["[이 고양이 성격 프로필 (피드백 "+catDB.feedbacks.length+"회 기반)]"];
  if(topEmo.length)lines.push("주요 감정 패턴: "+topEmo.join(", "));

  if(catDB.noCnt>3)lines.push("⚠️ 과거 부정확 판단 "+catDB.noCnt+"회 — 더 신중하게 관찰 필요");

  return lines.join("\n")+"\n\n";
}

  var _vidInfo=useState(null),vidInfo=_vidInfo[0],setVidInfo=_vidInfo[1];

  var vRef=useRef(null),cRef=useRef(null),stRef=useRef(null),vidRef=useRef(null);

  function abortAllRequests(){

    var ctrl=new AbortController();

  function fullStop(){

  function openCam(f){setCamOk(false);setCamErr(null);autoS.current=false;if(stRef.current){stRef.current.getTracks().forEach(function(t){t.stop();});stRef.current=null;}navigator.mediaDevices.getUserMedia({video:{facingMode:f||face,width:{ideal:1280},height:{ideal:960}},audio:false}).then(function(s){stRef.current=s;if(vRef.current){vRef.current.srcObject=s;vRef.current.onloadedmetadata=function(){vRef.current.play().catch(function(){});setCamOk(true);};}}).catch(function(e){setCamErr(e.name==="NotAllowedError"?"카메라 권한 허용 필요":"카메라 오류");});}

  function cap(el){if(!el||!cRef.current)return null;var c=cRef.current,w=el.videoWidth||el.width||720,h=el.videoHeight||el.height||540,sc=Math.min(720/w,1);c.width=Math.round(w*sc);c.height=Math.round(h*sc);c.getContext("2d").drawImage(el,0,0,c.width,c.height);return c.toDataURL("image/jpeg",0.75).split(",")[1];}

  function reset(){setSub("");setMood("");setDet("");setCnt(0);setErr(null);setSubL(false);setDetL(false);setPhoto(null);if(prevVidUrlRef.current){URL.revokeObjectURL(prevVidUrlRef.current);prevVidUrlRef.current=null;}setVidUrl(null);setVidOk(false);setVidPlay(false);setVidInfo(null);setToy(null);setFbOk(false);setStopped(false);prevSub.current="";latestSubRef.current="";autoS.current=false;}

  function onPhoto(e){var f=e.target.files&&e.target.files[0];if(!f)return;e.target.value="";fullStop();reset();setSrc("photo");setScr("analyze");var r=new FileReader();r.onload=function(ev){setPhoto(ev.target.result);var s=++sessionRef.current;var c=document.createElement("canvas"),img=new Image();img.onload=function(){var sc=Math.min(720/img.width,1);c.width=img.width*sc;c.height=img.height*sc;c.getContext("2d").drawImage(img,0,0,c.width,c.height);doAnalyze(c.toDataURL("image/jpeg",0.75).split(",")[1],s,true);};img.src=ev.target.result;};r.readAsDataURL(f);}
  function onVideo(e){var f=e.target.files&&e.target.files[0];if(!f)return;e.target.value="";fullStop();reset();setSrc("video");setScr("analyze");setVidInfo({name:f.name,size:(f.size/1024/1024).toFixed(1)+"MB"});var url=URL.createObjectURL(f);prevVidUrlRef.current=url;setVidUrl(url);}
  function onVidLoaded(){setVidOk(true);if(vidRef.current&&isFinite(vidRef.current.duration))setVidInfo(function(p){return p?Object.assign({},p,{dur:Math.floor(vidRef.current.duration/60)+"분"+Math.floor(vidRef.current.duration%60)+"초"}):p;});}

  if(scr==="home")return html`<div style=${S.shell}><div style=${{minHeight:"100dvh",background:"linear-gradient(170deg,#13131f,#161630 40%,#0d1b3a)",padding:"0 20px 28px",display:"flex",flexDirection:"column",alignItems:"center"}}><div style=${{textAlign:"center",paddingTop:44,marginBottom:20}}><div style=${{width:90,height:90,borderRadius:45,background:"linear-gradient(135deg,#FF6B6B,#FF8C42,#4ECDC4)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 12px",animation:"pulse 3s ease-in-out infinite"}}><span style=${{fontSize:50}}>🐱</span></div><h1 style=${{fontSize:25,fontWeight:900,color:"#f0f0f5"}}>냥냥 행동분석</h1><p style=${{fontSize:12,color:"#888",marginTop:4}}>AI 고양이 행동교정 전문가</p></div>${(catDB.okCnt+catDB.noCnt>0)&&html`<div style=${{width:"100%",background:"rgba(78,205,196,.06)",borderRadius:10,padding:"8px 14px",marginBottom:12,border:"1px solid rgba(78,205,196,.1)",fontSize:11,color:"#4ECDC4"}}>📊 피드백 ${catDB.okCnt+catDB.noCnt}회 (정확 ${catDB.okCnt} / 수정 ${catDB.noCnt})</div>`}<div style=${{width:"100%",display:"flex",flexDirection:"column",gap:10}}>${MODES.map(function(m,i){return html`<button key=${m.id} style=${{width:"100%",background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.06)",borderLeft:"4px solid "+m.color,borderRadius:14,padding:"15px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",textAlign:"left"}} onClick=${function(){pickMode(m.id);}}><div style=${{display:"flex",alignItems:"center",gap:14}}><span style=${{fontSize:34}}>${m.icon}</span><div><div style=${{fontSize:15,fontWeight:700,color:m.color}}>${m.label}</div><div style=${{fontSize:11,color:"#888",marginTop:2}}>${m.desc}</div></div></div><span style=${{fontSize:20,color:"#555"}}>›</span></button>`;})}</div><button style=${{marginTop:14,padding:"11px 22px",background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.08)",borderRadius:12,color:"#aab",fontSize:12.5,width:"100%"}} onClick=${function(){setScr("history");}}>📋 기록 (${hist.length})</button><div style=${{marginTop:"auto",paddingTop:20,fontSize:10,color:"#666",textAlign:"center"}}>AI 분석은 참고용이며 수의사 상담을 대체하지 않습니다</div></div></div>`;
  if(scr==="source")return html`<div style=${S.shell}><div style=${{...S.topBar,background:clr}}><button style=${S.topBtn} onClick=${goHome}>← 홈</button><span style=${S.topTitle}>${sm?sm.icon:""} ${sm?sm.label:""}</span><span style=${{width:56}}/></div><div style=${S.scroll}><div style=${{padding:"30px 20px"}}><p style=${{color:"#eee",fontSize:16,fontWeight:700,textAlign:"center",marginBottom:24}}>분석 소스 선택</p><div style=${{display:"flex",gap:10,marginBottom:14}}><button class="src-btn" style=${{borderColor:clr+"44"}} onClick=${pickCam}><span style=${{fontSize:36}}>📷</span><span style=${{fontWeight:700,color:clr}}>실시간 카메라</span><span style=${{fontSize:10,color:"#888"}}>🎤 마이크 연동</span></button></div><div style=${{display:"flex",gap:10}}><div class="src-btn"><span style=${{fontSize:36}}>🖼️</span><span style=${{fontWeight:700,color:"#FFD700"}}>사진 (1회)</span><input type="file" accept="image/*" onChange=${onPhoto}/></div><div class="src-btn"><span style=${{fontSize:36}}>🎬</span><span style=${{fontWeight:700,color:"#a29bfe"}}>영상 (MP4)</span><input type="file" accept="video/*" onChange=${onVideo}/></div></div></div></div></div>`;

  return html`<div style=${S.shell}><div style=${{...S.topBar,background:clr}}><button style=${S.topBtn} onClick=${goHome}>← 홈</button><span style=${S.topTitle}>${sm?sm.icon:""} ${sm?sm.label:""}</span>
    ${src==="cam"?html`<div style=${{display:"flex",gap:6}}><button style=${{...S.topBtn,background:micOn?"rgba(255,68,68,.4)":"rgba(255,255,255,.18)"}} onClick=${toggleMic}>${micOn?"🎤":"🔇"}</button><button style=${S.topBtn} onClick=${flipCam}>🔄</button></div>`:html`<span style=${{width:56}}/>`}
  </div><div style=${S.scroll}>
    ${src==="cam"&&html`<div style=${S.camWrap}><video ref=${vRef} autoPlay playsInline muted style=${S.video}/><canvas ref=${cRef} style=${{display:"none"}}/>

      ${stopped&&html`<div style=${S.overlay}><span style=${{fontSize:40}}>✅</span><p style=${{color:"#4ECDC4",marginTop:12,fontWeight:700}}>분석 종료</p></div>`}
      ${camErr&&html`<div style=${S.overlay}><p style=${{color:"#ff7070"}}>${camErr}</p></div>`}

    </div>`}

    ${src==="video"&&vidUrl&&html`<div><video ref=${vidRef} src=${vidUrl} controls playsInline onLoadedData=${onVidLoaded} onPlay=${onVidPlay} onPause=${onVidPause} onEnded=${onVidPause} style=${{width:"100%",maxHeight:400,background:"#000"}}/><canvas ref=${cRef} style=${{display:"none"}}/></div>`}
    ${src==="video"&&vidInfo&&html`<div style=${{padding:"8px 16px",background:"rgba(78,205,196,.06)",fontSize:12,color:"#4ECDC4"}}>🎬 ${(vidInfo.name||"").slice(0,20)} · ${vidInfo.size}${vidInfo.dur?" · "+vidInfo.dur:""}</div>`}
    ${src==="video"&&vidOk&&!vidPlay&&!stopped&&html`<div style=${{padding:24,textAlign:"center"}}><div style=${{fontSize:32,animation:"bounce 1.5s infinite"}}>👆</div><p style=${{color:"#a29bfe",fontSize:15,fontWeight:800,marginTop:8}}>▶ 재생하면 분석 시작!</p></div>`}
    ${src==="cam"&&micOn&&html`<div style=${{display:"flex",alignItems:"center",gap:8,padding:"8px 16px",background:"rgba(255,68,68,.08)",fontSize:12}}><span style=${{width:8,height:8,borderRadius:4,background:"#ff4444"}}></span><span style=${{color:"#ff6666",fontWeight:700}}>MIC ON</span></div>`}

    ${subL&&html`<div style=${{background:"rgba(0,0,0,.85)",padding:"14px 18px",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}><div class="spinner-sm"/><span style=${{color:"#FFD700",fontSize:13}}>통역 중...</span></div>`}
    ${sub&&!subL&&html`<div style=${{display:"flex",gap:10,padding:"10px 18px"}}>${fbOk?html`<div style=${{flex:1,textAlign:"center",color:"#4ECDC4",fontSize:12,padding:8}}>✅ 반영됨</div>`:html`<${React.Fragment}><button style=${{flex:1,padding:12,borderRadius:10,background:"rgba(78,205,196,.1)",color:"#4ECDC4",fontSize:13,fontWeight:700}} onClick=${function(){onFb(true);}}>👍 맞아요</button><button style=${{flex:1,padding:12,borderRadius:10,background:"rgba(255,80,80,.1)",color:"#ff7070",fontSize:13,fontWeight:700}} onClick=${function(){onFb(false);}}>👎 틀려요</button></$>`}</div>`}

    ${err&&html`<div style=${{margin:"14px 18px",padding:14,background:"rgba(255,80,80,.12)",border:"1px solid rgba(255,80,80,.25)",borderRadius:12,color:"#ff7070",fontSize:12}}>⚠️ ${err}</div>`}
    ${detL&&!det&&html`<div style=${{padding:20,textAlign:"center",color:"#888",fontSize:12,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}><div class="spinner-sm"/>상세 분석 중...</div>`}
    ${det&&html`<div class="fade-in"><div style=${{display:"flex",alignItems:"center",gap:8,padding:"14px 18px 4px"}}><span style=${{fontSize:18}}>${sm?sm.icon:""}</span><span style=${{color:"#f0f0f5",fontSize:15,fontWeight:700}}>상세 분석</span></div><${Txt} text=${det}/></div>`}
    ${src==="photo"&&!subL&&sub&&html`<div style=${{padding:"4px 20px 20px"}}><div class="src-btn" style=${{padding:"14px 10px"}}><span>🖼️ 다른 사진</span><input type="file" accept="image/*" onChange=${onPhoto}/></div></div>`}
