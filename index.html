<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#13131f">
<title>냥냥 행동분석</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;900&display=swap');
*{box-sizing:border-box;margin:0;padding:0;font-family:'Noto Sans KR',sans-serif;-webkit-tap-highlight-color:transparent}
html,body,#root{width:100%;min-height:100vh;min-height:100dvh;background:#111119;overflow-x:hidden}
button{border:none;background:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif}
.paw{position:absolute;opacity:.1;pointer-events:none}
.p1{top:28px;left:18px;font-size:26px;animation:fl1 4s ease-in-out infinite}
.p2{top:85px;right:28px;font-size:20px;animation:fl2 5s ease-in-out infinite .5s}
.p3{top:190px;left:45px;font-size:16px;animation:fl3 6s ease-in-out infinite 1s}
@keyframes fl1{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-18px) rotate(15deg)}}
@keyframes fl2{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-12px) rotate(-10deg)}}
@keyframes fl3{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-22px) rotate(20deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}
@keyframes scanY{0%{top:10%}50%{top:85%}100%{top:10%}}
@keyframes livePulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes progressBar{from{width:0}to{width:100%}}
.spinner{width:44px;height:44px;border:3px solid rgba(255,255,255,.15);border-top-color:#4ECDC4;border-radius:50%;animation:spin .8s linear infinite}
.spinner-sm{width:20px;height:20px;border:2px solid rgba(255,255,255,.15);border-top-color:#4ECDC4;border-radius:50%;animation:spin .8s linear infinite}
.fade-in{animation:fadeUp .5s ease-out}
.card-anim{animation:fadeUp .5s ease-out both}
.scan-line{position:absolute;left:8%;right:8%;height:2px;background:linear-gradient(90deg,transparent,#4ECDC4,transparent);box-shadow:0 0 12px rgba(78,205,196,.5);animation:scanY 3s ease-in-out infinite;pointer-events:none;z-index:2}
.live-dot{width:10px;height:10px;border-radius:50%;background:#ff4444;animation:livePulse 1.2s ease-in-out infinite;flex-shrink:0}
.progress-track{width:100%;height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;border-radius:2px;animation:progressBar 3s linear infinite}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.js"></script>

<script>
/*
 * ============================================
 *   여기에 본인의 Anthropic API 키를 넣으세요
 *   (따옴표 안에 키를 붙여넣기)
 * ============================================
 */
var API_KEY = "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";
/* ============================================ */

var html = htm.bind(React.createElement);
var useState=React.useState,useEffect=React.useEffect,useRef=React.useRef,useCallback=React.useCallback;

var MODES=[
  {id:"toy",icon:"\u{1F9F8}",label:"\uC7A5\uB09C\uAC10 \uBD84\uC11D",desc:"\uC7A5\uB09C\uAC10\uC744 \uBE44\uCD94\uBA74 \uC2E4\uC2DC\uAC04 \uBD84\uC11D",color:"#FF6B6B",
    prompt:"당신은 고양이 행동학 및 놀이 전문가입니다. 이 이미지에 보이는 장난감/물건을 분석하고 다음을 한국어로 상세히 답변하세요:\n1. 🧸 장난감 분석: 종류, 재질, 특징\n2. 😺 고양이 반응 예측\n3. ❌ 안 노는 이유 3가지\n4. 💡 놀아주는 방법 3가지\n5. ⭐ 추천 보완 장난감\n6. ⚠️ 안전 주의사항\n마크다운 형식 없이 이모지와 줄바꿈으로 깔끔하게 답변하세요."},
  {id:"behavior",icon:"\u{1F431}",label:"\uD589\uB3D9 \uBD84\uC11D",desc:"\uACE0\uC591\uC774\uB97C \uBE44\uCD94\uBA74 \uC2E4\uC2DC\uAC04 \uBD84\uC11D",color:"#4ECDC4",
    prompt:"당신은 수의행동학 전문가입니다. 이 이미지에 보이는 고양이의 행동을 분석하고 다음을 한국어로 상세히 답변하세요:\n1. 🐱 현재 행동 분석: 자세, 표정, 꼬리, 귀\n2. 💭 감정 상태\n3. 🗣️ 고양이 통역 (의인화하여 재미있게)\n4. ❤️ 원하는 것\n5. 🎯 최적의 놀이 방법\n6. 📊 스트레스 지수: 1-10\n마크다운 형식 없이 이모지와 줄바꿈으로 깔끔하게 답변하세요."},
  {id:"correction",icon:"\u{1FA7A}",label:"\uD589\uB3D9 \uAD50\uC815",desc:"\uBB38\uC81C\uD589\uB3D9\uC744 \uBE44\uCD94\uBA74 \uC2E4\uC2DC\uAC04 \uAD50\uC815",color:"#FF8C42",
    prompt:"당신은 고양이 행동교정 전문 수의행동학자입니다. 이 이미지에서 보이는 고양이의 행동을 분석하고 행동 교정 솔루션을 한국어로 제공하세요:\n1. 🔍 문제 행동 진단\n2. 🧠 원인 분석\n3. ⚡ 즉각 대응법\n4. 📋 단계별 교정 계획 (1주/2주/4주)\n5. 🏠 환경 개선\n6. 🍽️ 식이/건강 체크\n7. ⚠️ 병원 방문 필요성\n8. 💪 재발 방지 예방법\n마크다운 형식 없이 이모지와 줄바꿈으로 깔끔하게 답변하세요."}
];

var TIPS=["고양이는 하루 평균 15시간 수면을 취해요 😴","꼬리를 세우고 끝을 살짝 구부리면 반가운 인사예요 🐱","느린 눈 깜빡임은 '사랑해'라는 뜻이에요 😻","고양이는 사냥 본능이 있어 움직이는 장난감을 좋아해요 🎯","캣닢에 반응하는 고양이는 약 70%예요 🌿","골골송은 치유와 편안함의 신호예요 🎵","고양이는 높은 곳을 좋아해요 - 캣타워를 추천해요 🏔️"];

var S={
  shell:{maxWidth:520,margin:"0 auto",minHeight:"100dvh",background:"#111119",position:"relative",overflow:"hidden",display:"flex",flexDirection:"column"},
  home:{minHeight:"100dvh",background:"linear-gradient(170deg,#13131f,#161630 40%,#0d1b3a)",padding:"0 20px 28px",display:"flex",flexDirection:"column",alignItems:"center",position:"relative"},
  logoWrap:{textAlign:"center",paddingTop:44,marginBottom:16,animation:"fadeUp .6s ease-out"},
  logoCircle:{width:90,height:90,borderRadius:45,background:"linear-gradient(135deg,#FF6B6B,#FF8C42,#4ECDC4)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 12px",boxShadow:"0 6px 28px rgba(255,107,107,.25)",animation:"pulse 3s ease-in-out infinite"},
  appTitle:{fontSize:25,fontWeight:900,color:"#f0f0f5",letterSpacing:-.5},
  appSub:{fontSize:12,color:"#8888aa",marginTop:4},
  tipBox:{background:"rgba(255,255,255,.06)",borderRadius:12,padding:"10px 14px",display:"flex",alignItems:"center",gap:8,width:"100%",marginBottom:20,border:"1px solid rgba(255,255,255,.05)"},
  modeCard:{width:"100%",background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.06)",borderRadius:14,padding:"15px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",cursor:"pointer",textAlign:"left"},
  histBtn:{marginTop:16,padding:"11px 22px",background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.08)",borderRadius:12,color:"#aab",fontSize:12.5},
  topBar:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",background:"#333",position:"sticky",top:0,zIndex:10,flexShrink:0},
  topTitle:{color:"#fff",fontSize:15,fontWeight:700},
  topBtn:{background:"rgba(255,255,255,.18)",color:"#fff",padding:"7px 14px",borderRadius:8,fontSize:12.5},
  scroll:{flex:1,overflowY:"auto",background:"linear-gradient(180deg,#13131f,#161630)",WebkitOverflowScrolling:"touch"},
  camWrap:{position:"relative",width:"100%",aspectRatio:"4/3",background:"#000",overflow:"hidden",flexShrink:0},
  video:{width:"100%",height:"100%",objectFit:"cover",display:"block"},
  camOverlay:{position:"absolute",inset:0,background:"rgba(0,0,0,.75)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",backdropFilter:"blur(3px)",zIndex:3},
  liveBar:{display:"flex",alignItems:"center",gap:8,padding:"10px 16px",background:"rgba(255,255,255,.04)",borderBottom:"1px solid rgba(255,255,255,.06)"},
  errBox:{margin:"14px 18px",padding:"14px 16px",background:"rgba(255,80,80,.12)",border:"1px solid rgba(255,80,80,.25)",borderRadius:12,color:"#ff7070",fontSize:13,display:"flex",flexDirection:"column",gap:10},
  retryBtn:{alignSelf:"flex-start",padding:"8px 20px",background:"rgba(255,255,255,.12)",borderRadius:8,color:"#fff",fontSize:12.5},
  resTxt:{padding:"12px 18px 16px",color:"#ccccdd",fontSize:13.5,lineHeight:1.8,whiteSpace:"pre-wrap"},
  hItem:{width:"100%",background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.06)",borderRadius:14,padding:14,cursor:"pointer",textAlign:"left",display:"block",marginBottom:10}
};

function ResultText(props){
  var lines=props.text.split("\n");
  return html`<div style=${S.resTxt}>${lines.map(function(l,i){return html`<p key=${i} style=${{margin:l.trim()?"5px 0":"10px 0",lineHeight:1.75}}>${l}</p>`;})}</div>`;
}

function App(){
  var _mode=useState(null),mode=_mode[0],setMode=_mode[1];
  var _scr=useState("home"),screen=_scr[0],setScreen=_scr[1];
  var _az=useState(false),analyzing=_az[0],setAnalyzing=_az[1];
  var _res=useState(null),result=_res[0],setResult=_res[1];
  var _err=useState(null),error=_err[0],setError=_err[1];
  var _hist=useState([]),history=_hist[0],setHistory=_hist[1];
  var _tip=useState(TIPS[0]),tip=_tip[0],setTip=_tip[1];
  var _vi=useState(null),viewItem=_vi[0],setViewItem=_vi[1];
  var _cr=useState(false),camReady=_cr[0],setCamReady=_cr[1];
  var _ce=useState(null),camError=_ce[0],setCamError=_ce[1];
  var _fc=useState("environment"),facing=_fc[0],setFacing=_fc[1];
  var _live=useState(false),liveOn=_live[0],setLiveOn=_live[1];
  var _cnt=useState(0),analyzeCount=_cnt[0],setAnalyzeCount=_cnt[1];
  var _paused=useState(false),paused=_paused[0],setPaused=_paused[1];

  var videoRef=useRef(null),canvasRef=useRef(null),streamRef=useRef(null);
  var modeRef=useRef(mode),analyzingRef=useRef(false),liveRef=useRef(false),timerRef=useRef(null),pausedRef=useRef(false);

  useEffect(function(){modeRef.current=mode;},[mode]);
  useEffect(function(){liveRef.current=liveOn;},[liveOn]);
  useEffect(function(){analyzingRef.current=analyzing;},[analyzing]);
  useEffect(function(){pausedRef.current=paused;},[paused]);
  useEffect(function(){
    var iv=setInterval(function(){setTip(TIPS[Math.floor(Math.random()*TIPS.length)]);},5000);
    return function(){clearInterval(iv);};
  },[]);

  var startCam=useCallback(function(face){
    setCamReady(false);setCamError(null);
    if(streamRef.current){streamRef.current.getTracks().forEach(function(t){t.stop();});streamRef.current=null;}
    navigator.mediaDevices.getUserMedia({
      video:{facingMode:face||facing,width:{ideal:1280},height:{ideal:960}},audio:false
    }).then(function(stream){
      streamRef.current=stream;
      if(videoRef.current){
        videoRef.current.srcObject=stream;
        videoRef.current.onloadedmetadata=function(){
          videoRef.current.play().catch(function(){});
          setCamReady(true);
        };
      }
    }).catch(function(e){
      if(e.name==="NotAllowedError") setCamError("카메라 권한을 허용해주세요.\n설정 > 앱 > 브라우저 > 권한 > 카메라 허용");
      else if(e.name==="NotFoundError") setCamError("카메라를 찾을 수 없습니다.");
      else setCamError("카메라 오류: "+e.message);
    });
  },[facing]);

  var stopCam=useCallback(function(){
    if(streamRef.current){streamRef.current.getTracks().forEach(function(t){t.stop();});streamRef.current=null;}
    setCamReady(false);
  },[]);

  var flipCam=useCallback(function(){
    var next=facing==="environment"?"user":"environment";
    setFacing(next);startCam(next);
  },[facing,startCam]);

  useEffect(function(){return function(){
    if(streamRef.current) streamRef.current.getTracks().forEach(function(t){t.stop();});
    if(timerRef.current) clearInterval(timerRef.current);
  };},[]);

  function captureFrame(){
    if(!videoRef.current||!canvasRef.current) return null;
    var v=videoRef.current,c=canvasRef.current;
    c.width=v.videoWidth;c.height=v.videoHeight;
    c.getContext("2d").drawImage(v,0,0);
    return c.toDataURL("image/jpeg",0.8);
  }

  function doAnalyze(imgUrl){
    var cur=modeRef.current;if(!cur) return;
    var b64=imgUrl.split(",")[1];
    var m=MODES.find(function(x){return x.id===cur;});
    setAnalyzing(true);setError(null);
    fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "x-api-key":API_KEY,
        "anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true"
      },
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",max_tokens:1500,
        messages:[{role:"user",content:[
          {type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},
          {type:"text",text:m.prompt}
        ]}]
      })
    }).then(function(r){return r.json();})
    .then(function(data){
      if(data.error) throw new Error(data.error.message);
      var txt=data.content?data.content.map(function(c){return c.text||"";}).join("\n"):"결과 없음";
      setResult(txt);
      setAnalyzeCount(function(c){return c+1;});
      setHistory(function(p){return [{id:Date.now(),mode:m.label,icon:m.icon,image:imgUrl,result:txt,time:new Date().toLocaleString("ko-KR")}].concat(p).slice(0,30);});
    }).catch(function(err){setError(err.message||"오류 발생");})
    .finally(function(){setAnalyzing(false);});
  }

  function startLive(){
    setLiveOn(true);setPaused(false);
    var img=captureFrame();if(img)doAnalyze(img);
    if(timerRef.current)clearInterval(timerRef.current);
    timerRef.current=setInterval(function(){
      if(!liveRef.current||pausedRef.current||analyzingRef.current)return;
      var img2=captureFrame();if(img2)doAnalyze(img2);
    },3000);
  }

  function stopLive(){
    setLiveOn(false);
    if(timerRef.current){clearInterval(timerRef.current);timerRef.current=null;}
  }

  function togglePause(){setPaused(function(p){return !p;});}

  function goHome(){
    stopLive();stopCam();
    setMode(null);setScreen("home");setResult(null);setError(null);setViewItem(null);setCamError(null);setAnalyzeCount(0);
  }

  function enterMode(id){
    setMode(id);setScreen("analyze");setResult(null);setError(null);setCamError(null);setAnalyzeCount(0);setLiveOn(false);
    setTimeout(function(){startCam(facing);},150);
  }

  var sm=MODES.find(function(x){return x.id===mode;});

  /* ===== HISTORY DETAIL ===== */
  if(viewItem) return html`
    <div style=${S.shell}>
      <div style=${S.topBar}>
        <button style=${S.topBtn} onClick=${function(){setViewItem(null);}}>← 뒤로</button>
        <span style=${S.topTitle}>${viewItem.icon} ${viewItem.mode}</span>
        <span style=${{width:56}}/>
      </div>
      <div style=${S.scroll}>
        ${viewItem.image&&html`<img src=${viewItem.image} style=${{width:"100%",maxHeight:300,objectFit:"cover"}}/>`}
        <div style=${{padding:"10px 20px 4px",color:"#777",fontSize:11}}>${viewItem.time}</div>
        <${ResultText} text=${viewItem.result}/>
      </div>
    </div>`;

  /* ===== HISTORY LIST ===== */
  if(screen==="history") return html`
    <div style=${S.shell}>
      <div style=${S.topBar}>
        <button style=${S.topBtn} onClick=${goHome}>← 홈</button>
        <span style=${S.topTitle}>📋 분석 기록</span>
        <span style=${{width:56}}/>
      </div>
      <div style=${S.scroll}>
        <div style=${{padding:16}}>
          ${history.length===0?html`
            <div style=${{textAlign:"center",paddingTop:60}}>
              <div style=${{fontSize:52}}>📭</div>
              <p style=${{color:"#888",marginTop:14}}>아직 분석 기록이 없어요</p>
            </div>
          `:history.map(function(h){return html`
            <button key=${h.id} style=${S.hItem} onClick=${function(){setViewItem(h);}}>
              <div style=${{display:"flex",alignItems:"center",gap:12}}>
                ${h.image&&html`<img src=${h.image} style=${{width:52,height:52,borderRadius:10,objectFit:"cover"}}/>`}
                <div style=${{flex:1,minWidth:0}}>
                  <div style=${{color:"#eee",fontSize:13,fontWeight:700}}>${h.icon} ${h.mode}</div>
                  <div style=${{color:"#777",fontSize:10,marginTop:2}}>${h.time}</div>
                  <div style=${{color:"#999",fontSize:11,marginTop:3,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>${h.result.slice(0,50)}</div>
                </div>
                <span style=${{color:"#555"}}>›</span>
              </div>
            </button>`;})}
        </div>
      </div>
    </div>`;

  /* ===== HOME ===== */
  if(screen==="home") return html`
    <div style=${S.shell}>
      <div style=${S.home}>
        <div class="paw p1">🐾</div><div class="paw p2">🐾</div><div class="paw p3">🐾</div>
        <div style=${S.logoWrap}>
          <div style=${S.logoCircle}><span style=${{fontSize:50}}>🐱</span></div>
          <h1 style=${S.appTitle}>냥냥 행동분석</h1>
          <p style=${S.appSub}>AI 고양이 행동교정 전문가</p>
          <p style=${{fontSize:11,color:"#4ECDC4",marginTop:6}}>✨ 실시간 자동 분석 (3초 간격)</p>
        </div>
        <div style=${S.tipBox}>
          <span>💡</span>
          <span style=${{color:"#ccd",fontSize:12,lineHeight:1.5}}>${tip}</span>
        </div>
        <div style=${{width:"100%",display:"flex",flexDirection:"column",gap:10}}>
          ${MODES.map(function(m,i){return html`
            <button key=${m.id} class="card-anim"
              style=${{...S.modeCard,borderLeft:"4px solid "+m.color,animationDelay:i*.08+"s"}}
              onClick=${function(){enterMode(m.id);}}>
              <div style=${{display:"flex",alignItems:"center",gap:14}}>
                <span style=${{fontSize:34}}>${m.icon}</span>
                <div>
                  <div style=${{fontSize:15,fontWeight:700,color:m.color}}>${m.label}</div>
                  <div style=${{fontSize:11,color:"#888",marginTop:2}}>${m.desc}</div>
                </div>
              </div>
              <span style=${{fontSize:20,color:"#555"}}>›</span>
            </button>`;})}
        </div>
        <button style=${S.histBtn} onClick=${function(){setScreen("history");}}>📋 분석 기록 (${history.length})</button>
        <div style=${{marginTop:"auto",paddingTop:20,textAlign:"center"}}>
          <span style=${{fontSize:10,color:"#666"}}>AI 분석은 참고용이며 수의사 상담을 대체하지 않습니다</span>
        </div>
      </div>
    </div>`;

  /* ===== ANALYSIS (LIVE CAMERA) ===== */
  var clr=sm?sm.color:"#4ECDC4";
  return html`
    <div style=${S.shell}>
      <div style=${{...S.topBar,background:clr}}>
        <button style=${S.topBtn} onClick=${goHome}>← 홈</button>
        <span style=${S.topTitle}>${sm?sm.icon:""} ${sm?sm.label:""}</span>
        <button style=${S.topBtn} onClick=${flipCam}>🔄</button>
      </div>
      <div style=${S.scroll}>
        <div style=${S.camWrap}>
          <video ref=${videoRef} autoPlay playsInline muted style=${S.video}/>
          <canvas ref=${canvasRef} style=${{display:"none"}}/>
          ${!camReady&&!camError&&html`<div style=${S.camOverlay}><div class="spinner"/><p style=${{color:"#fff",marginTop:12,fontSize:14}}>카메라 로딩 중...</p></div>`}
          ${camError&&html`<div style=${S.camOverlay}><span style=${{fontSize:40}}>📷</span><p style=${{color:"#ff7070",marginTop:12,fontSize:13,textAlign:"center",whiteSpace:"pre-line",lineHeight:1.6,padding:"0 24px"}}>${camError}</p><button style=${{...S.retryBtn,marginTop:16}} onClick=${function(){startCam(facing);}}>다시 시도</button></div>`}
          ${camReady&&liveOn&&html`<div class="scan-line"/>`}
          ${camReady&&html`
            <div style=${{position:"absolute",bottom:0,left:0,right:0,padding:"12px 16px 16px",background:"linear-gradient(transparent,rgba(0,0,0,.7))",zIndex:5,display:"flex",justifyContent:"center",gap:12}}>
              ${!liveOn?html`
                <button style=${{display:"flex",alignItems:"center",gap:8,padding:"14px 36px",borderRadius:50,color:"#fff",background:clr,boxShadow:"0 4px 24px "+clr+"66",fontSize:15,fontWeight:800}} onClick=${startLive}>
                  ▶️ 실시간 분석 시작
                </button>
              `:html`
                <button style=${{padding:"12px 24px",borderRadius:50,color:"#fff",background:paused?"#4ECDC4":"rgba(255,255,255,.25)",fontSize:13,fontWeight:700}} onClick=${togglePause}>
                  ${paused?"▶️ 재개":"⏸️ 일시정지"}
                </button>
                <button style=${{padding:"12px 24px",borderRadius:50,color:"#fff",background:"#ff4444",fontSize:13,fontWeight:700}} onClick=${stopLive}>
                  ⏹️ 중지
                </button>
              `}
            </div>`}
        </div>

        ${liveOn&&html`
          <div style=${S.liveBar}>
            <div class="live-dot"/><span style=${{color:"#ff6666",fontSize:12,fontWeight:700}}>LIVE</span>
            <span style=${{color:"#999",fontSize:11}}>3초 자동</span>
            <span style=${{marginLeft:"auto",color:"#4ECDC4",fontSize:11,fontWeight:600}}>분석 ${analyzeCount}회</span>
            ${analyzing&&html`<div class="spinner-sm"/>`}
          </div>
          <div class="progress-track"><div class="progress-fill" style=${{background:clr}} key=${analyzeCount}/></div>
        `}

        ${paused&&liveOn&&html`
          <div style=${{padding:"10px 16px",background:"rgba(255,200,50,.08)",borderBottom:"1px solid rgba(255,200,50,.15)",display:"flex",alignItems:"center",gap:8}}>
            <span>⏸️</span><span style=${{color:"#ffc832",fontSize:12}}>일시정지 중</span>
          </div>`}

        ${error&&html`<div style=${S.errBox}><span>⚠️ ${error}</span></div>`}

        ${result&&html`
          <div class="fade-in" key=${analyzeCount}>
            <div style=${{display:"flex",alignItems:"center",gap:8,padding:"14px 18px 4px"}}>
              <span style=${{fontSize:18}}>${sm?sm.icon:""}</span>
              <span style=${{color:"#f0f0f5",fontSize:15,fontWeight:700}}>분석 결과</span>
              ${analyzing&&html`<div class="spinner-sm" style=${{marginLeft:8}}/>`}
            </div>
            <${ResultText} text=${result}/>
          </div>`}

        ${!result&&!error&&!analyzing&&liveOn&&html`
          <div style=${{padding:"40px 20px",textAlign:"center"}}><div class="spinner"/><p style=${{color:"#888",marginTop:16,fontSize:13}}>첫 분석 대기 중...</p></div>`}

        ${!result&&!liveOn&&camReady&&html`
          <div style=${{padding:"30px 20px",textAlign:"center"}}>
            <p style=${{color:"#888",fontSize:13,lineHeight:1.6}}>▶️ 버튼을 누르면 3초마다 자동 분석합니다</p>
          </div>`}
      </div>
    </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
