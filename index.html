  {id:"problem",icon:"🩺",label:"문제행동 분석",desc:"1분 촬영 → 문제행동 진단",color:"#FF8C42",sec:60,type:"video",

  {id:"food",icon:"🍽️",label:"사료/간식 분석",desc:"성분표 사진 → 영양 분석",color:"#a29bfe",sec:0,type:"photo",
    prompt:"당신은 수의영양학 전문가(보드인증 수의영양학 전문의)입니다.\n\n아래 이미지는 고양이 사료/간식/영양제의 영양성분표 또는 원재료 표시입니다.\n이미지에 보이는 텍스트를 정확히 읽고 분석해주세요.\n\n반드시 아래 항목을 한국어로 상세히 답변하세요:\n\n📷 인식된 내용\n- 이미지에서 읽을 수 있는 제품명, 성분, 수치를 기술\n- 읽기 어려운 부분은 '판독불가'로 표시\n\n✅ 고양이에게 좋은 성분\n- 각 성분이 왜 좋은지 설명\n- 동물성 단백질 함량 평가\n- 타우린, 오메가3 등 필수 영양소 확인\n\n❌ 고양이에게 해로운/주의할 성분\n- 위험 성분 (양파/마늘/포도/자일리톨/카페인/초콜릿 등)\n- 과다 섭취 주의 성분 (나트륨/인/마그네슘 등)\n- 불필요한 첨가물 (인공색소/방부제/향료)\n- 곡물 함량 평가\n\n📊 영양 균형 평가\n- 단백질/지방/탄수화물 비율 평가\n- AAFCO 기준 충족 여부 (추정)\n- 수분 함량 (습식/건식)\n\n🐱 급여 추천\n- 어떤 고양이에게 적합한지 (연령/체중/건강상태)\n- 급여량 추천\n- 주의사항\n\n⭐ 종합 평점: ★1-5 (근거 포함)\n\n이모지와 줄바꿈으로 보기 좋게 답변하세요. 성분표가 안 보이면 솔직히 말하세요."}
];
var TIPS=["고양이는 하루 15시간 수면 😴","꼬리를 세우면 반가운 인사 🐱","느린 눈 깜빡임은 사랑해 😻","사냥 본능으로 움직이는 장난감 좋아해 🎯","골골송은 편안함의 신호 🎵","고양이 사료에 양파/마늘은 절대 금지 🚫","타우린은 고양이 필수 아미노산 💊"];

function App(){
  var _scr=useState("home"),scr=_scr[0],setScr=_scr[1];
  var _mode=useState(null),mode=_mode[0],setMode=_mode[1];
  // recording
  var _camOk=useState(false),camOk=_camOk[0],setCamOk=_camOk[1];
  var _recording=useState(false),recording=_recording[0],setRecording=_recording[1];
  var _remain=useState(0),remain=_remain[0],setRemain=_remain[1];
  var _frames=useState([]),frames=_frames[0],setFrames=_frames[1];
  // analysis
  var _analyzing=useState(false),analyzing=_analyzing[0],setAnalyzing=_analyzing[1];
  var _result=useState(""),result=_result[0],setResult=_result[1];
  var _error=useState(null),error=_error[0],setError=_error[1];
  // photo mode
  var _photo=useState(null),photo=_photo[0],setPhoto=_photo[1];
  // misc
  var _face=useState("environment"),face=_face[0],setFace=_face[1];
  var _tip=useState(TIPS[0]),tip=_tip[0],setTip=_tip[1];
  var _hist=useState([]),hist=_hist[0],setHist=_hist[1];
  var _hv=useState(null),hv=_hv[0],setHv=_hv[1];

  var vRef=useRef(),cRef=useRef(),stRef=useRef();
  var timerRef=useRef(),frameRef=useRef();

  useEffect(function(){var iv=setInterval(function(){setTip(TIPS[Math.floor(Math.random()*TIPS.length)]);},5000);return function(){clearInterval(iv);cleanup();};},[]);

  function cleanup(){
    if(stRef.current){stRef.current.getTracks().forEach(function(t){t.stop();});}
    if(timerRef.current)clearInterval(timerRef.current);
    if(frameRef.current)clearInterval(frameRef.current);
  }

  function startCam(f){
    setCamOk(false);
    if(stRef.current){stRef.current.getTracks().forEach(function(t){t.stop();});}
    navigator.mediaDevices.getUserMedia({video:{facingMode:f||face,width:{ideal:1280},height:{ideal:960}},audio:false}).then(function(s){
      stRef.current=s;
      if(vRef.current){vRef.current.srcObject=s;vRef.current.onloadedmetadata=function(){vRef.current.play();setCamOk(true);};}
    }).catch(function(){setError("카메라 권한을 허용해주세요");});
  }

  function capFrame(){
    if(!vRef.current||!cRef.current)return null;
    var v=vRef.current,c=cRef.current;
    var sc=Math.min(720/v.videoWidth,1);
    c.width=v.videoWidth*sc;c.height=v.videoHeight*sc;
    c.getContext("2d").drawImage(v,0,0,c.width,c.height);
    return c.toDataURL("image/jpeg",0.75).split(",")[1];
  }

  // ===== 녹화 시작 =====
  function startRec(){
    var sm=MODES.find(function(x){return x.id===mode;});
    if(!sm)return;
    var totalSec=sm.sec;
    setRecording(true);setRemain(totalSec);setFrames([]);setResult("");setError(null);
    // 첫 프레임
    var f0=capFrame();
    var collected=f0?[f0]:[];
    // 5초마다 프레임 캡처 (장난감은 5초, 1분짜리는 10초 간격)
    var interval=totalSec<=20?5:10;
    frameRef.current=setInterval(function(){
      var fr=capFrame();
      if(fr)collected.push(fr);
    },interval*1000);
    // 카운트다운
    var left=totalSec;
    timerRef.current=setInterval(function(){
      left--;setRemain(left);
      if(left<=0){
        clearInterval(timerRef.current);
        clearInterval(frameRef.current);
        // 마지막 프레임
        var last=capFrame();if(last)collected.push(last);
        setRecording(false);
        setFrames(collected);
        // 카메라 정지
        if(stRef.current){stRef.current.getTracks().forEach(function(t){t.stop();});}
        setCamOk(false);
        // 분석 시작
        doAnalyze(collected,sm);
      }
    },1000);
  }

  // ===== 녹화 중 수동 중지 =====
  function stopRec(){
    clearInterval(timerRef.current);
    clearInterval(frameRef.current);
    var last=capFrame();
    setRecording(false);
    setFrames(function(prev){
      var all=last?prev.concat([last]):prev;
      if(stRef.current){stRef.current.getTracks().forEach(function(t){t.stop();});}
      setCamOk(false);
      var sm=MODES.find(function(x){return x.id===mode;});
      if(all.length>0&&sm)doAnalyze(all,sm);
      return all;
    });
  }

  // ===== AI 분석 =====
  function doAnalyze(frameList,sm){
    setAnalyzing(true);setError(null);
    // 프레임을 최대 4개로 제한 (토큰 절약)
    var selected=[];
    if(frameList.length<=4){selected=frameList;}
    else{
      var step=Math.floor(frameList.length/4);
      for(var i=0;i<4;i++){selected.push(frameList[Math.min(i*step,frameList.length-1)]);}
    }
    // API 메시지 구성
    var content=[];
    selected.forEach(function(f,i){
      content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:f}});
    });
    content.push({type:"text",text:sm.prompt});

    api({model:"claude-haiku-4-5-20251001",max_tokens:2500,messages:[{role:"user",content:content}]}).then(function(d){
      if(d.error)throw new Error(d.error.message||JSON.stringify(d.error));
      var t=d.content?d.content.map(function(c){return c.text||"";}).join("\n"):"결과 없음";
      setResult(t);
      setHist(function(p){return [{id:Date.now(),mode:sm.label,icon:sm.icon,result:t,time:new Date().toLocaleString("ko-KR")}].concat(p).slice(0,30);});
    }).catch(function(e){setError(e.message);}).finally(function(){setAnalyzing(false);});
  }

  // ===== 사진 분석 (사료/간식) =====
  function onPhoto(e){
    var f=e.target.files&&e.target.files[0];if(!f)return;e.target.value="";
    setPhoto(null);setResult("");setError(null);
    var r=new FileReader();
    r.onload=function(ev){
      setPhoto(ev.target.result);
      var c2=document.createElement("canvas"),img=new Image();
      img.onload=function(){
        var sc=Math.min(1024/img.width,1);c2.width=img.width*sc;c2.height=img.height*sc;
        c2.getContext("2d").drawImage(img,0,0,c2.width,c2.height);
        var b64=c2.toDataURL("image/jpeg",0.85).split(",")[1];
        var sm=MODES.find(function(x){return x.id===mode;});
        doAnalyze([b64],sm);
      };img.src=ev.target.result;
    };r.readAsDataURL(f);
  }

  function goHome(){cleanup();setScr("home");setMode(null);setRecording(false);setRemain(0);setFrames([]);setResult("");setError(null);setPhoto(null);setCamOk(false);setAnalyzing(false);setHv(null);}
  function enterMode(id){setMode(id);var m=MODES.find(function(x){return x.id===id;});if(m.type==="photo"){setScr("photo");}else{setScr("record");setResult("");setError(null);setFrames([]);setRecording(false);setTimeout(function(){startCam(face);},100);}}
  function flipCam(){var f2=face==="environment"?"user":"environment";setFace(f2);startCam(f2);}

  var sm=MODES.find(function(x){return x.id===mode;});
  var clr=sm?sm.color:"#4ECDC4";

  // ===== HISTORY DETAIL =====
  if(hv)return h`<div style=${{maxWidth:520,margin:"0 auto",minHeight:"100dvh",background:"#111119",display:"flex",flexDirection:"column"}}><div style=${{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",background:"#333"}}><button style=${{background:"rgba(255,255,255,.18)",color:"#fff",padding:"7px 14px",borderRadius:8,fontSize:12.5}} onClick=${function(){setHv(null);}}>← 뒤로</button><span style=${{color:"#fff",fontSize:15,fontWeight:700}}>${hv.icon} ${hv.mode}</span><span style=${{width:56}}/></div><div style=${{flex:1,overflowY:"auto",padding:"10px 18px",background:"#13131f"}}><div style=${{color:"#777",fontSize:11,marginBottom:10}}>${hv.time}</div><div style=${{color:"#ccd",fontSize:13.5,lineHeight:1.8,whiteSpace:"pre-wrap"}}>${hv.result}</div></div></div>`;

  // ===== HISTORY LIST =====
  if(scr==="history")return h`<div style=${{maxWidth:520,margin:"0 auto",minHeight:"100dvh",background:"#111119",display:"flex",flexDirection:"column"}}><div style=${{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",background:"#333"}}><button style=${{background:"rgba(255,255,255,.18)",color:"#fff",padding:"7px 14px",borderRadius:8,fontSize:12.5}} onClick=${goHome}>← 홈</button><span style=${{color:"#fff",fontSize:15,fontWeight:700}}>📋 기록</span><span style=${{width:56}}/></div><div style=${{flex:1,overflowY:"auto",padding:16}}>${hist.length===0?h`<div style=${{textAlign:"center",paddingTop:60,color:"#888"}}>아직 기록이 없어요</div>`:hist.map(function(x){return h`<button key=${x.id} style=${{width:"100%",background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.06)",borderRadius:14,padding:14,textAlign:"left",display:"block",marginBottom:10}} onClick=${function(){setHv(x);}}><div style=${{color:"#eee",fontSize:13,fontWeight:700}}>${x.icon} ${x.mode}</div><div style=${{color:"#888",fontSize:10,marginTop:4}}>${x.time}</div><div style=${{color:"#999",fontSize:11,marginTop:4,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>${x.result.slice(0,60)}</div></button>`;})}</div></div>`;

  // ===== HOME =====
  if(scr==="home")return h`<div style=${{maxWidth:520,margin:"0 auto",minHeight:"100dvh",background:"linear-gradient(170deg,#13131f,#161630 40%,#0d1b3a)",padding:"0 20px 28px",display:"flex",flexDirection:"column",alignItems:"center"}}>
    <div style=${{textAlign:"center",paddingTop:44,marginBottom:16}}>
      <div style=${{width:90,height:90,borderRadius:45,background:"linear-gradient(135deg,#FF6B6B,#FF8C42,#4ECDC4)",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 12px",boxShadow:"0 6px 28px rgba(255,107,107,.25)",animation:"pulse 3s ease-in-out infinite"}}><span style=${{fontSize:50}}>🐱</span></div>
      <h1 style=${{fontSize:25,fontWeight:900,color:"#f0f0f5"}}>냥냥 행동분석</h1>
      <p style=${{fontSize:12,color:"#8888aa",marginTop:4}}>AI 고양이 행동교정 전문가</p>
    </div>
    <div style=${{background:"rgba(255,255,255,.06)",borderRadius:12,padding:"10px 14px",display:"flex",alignItems:"center",gap:8,width:"100%",marginBottom:20,border:"1px solid rgba(255,255,255,.05)"}}><span>💡</span><span style=${{color:"#ccd",fontSize:12}}>${tip}</span></div>
    <div style=${{width:"100%",display:"flex",flexDirection:"column",gap:10}}>
      ${MODES.map(function(m){return h`<button key=${m.id} class="fade-in" style=${{width:"100%",background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.06)",borderLeft:"4px solid "+m.color,borderRadius:14,padding:"15px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",textAlign:"left"}} onClick=${function(){enterMode(m.id);}}>
        <div style=${{display:"flex",alignItems:"center",gap:14}}><span style=${{fontSize:34}}>${m.icon}</span><div><div style=${{fontSize:15,fontWeight:700,color:m.color}}>${m.label}</div><div style=${{fontSize:11,color:"#888",marginTop:2}}>${m.desc}</div></div></div>
        <span style=${{fontSize:20,color:"#555"}}>›</span>
      </button>`;})}
    </div>
    <button style=${{marginTop:14,padding:"11px 22px",background:"rgba(255,255,255,.05)",border:"1px solid rgba(255,255,255,.08)",borderRadius:12,color:"#aab",fontSize:12.5,width:"100%"}} onClick=${function(){setScr("history");}}>📋 분석 기록 (${hist.length})</button>
    <div style=${{marginTop:"auto",paddingTop:20}}><span style=${{fontSize:10,color:"#666"}}>AI 분석은 참고용이며 수의사 상담을 대체하지 않습니다</span></div>
  </div>`;

  // ===== PHOTO MODE (사료/간식 분석) =====
  if(scr==="photo")return h`<div style=${{maxWidth:520,margin:"0 auto",minHeight:"100dvh",background:"#111119",display:"flex",flexDirection:"column"}}>
    <div style=${{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",background:clr}}><button style=${{background:"rgba(255,255,255,.18)",color:"#fff",padding:"7px 14px",borderRadius:8,fontSize:12.5}} onClick=${goHome}>← 홈</button><span style=${{color:"#fff",fontSize:15,fontWeight:700}}>${sm.icon} ${sm.label}</span><span style=${{width:56}}/></div>
    <div style=${{flex:1,overflowY:"auto",padding:20}}>
      ${!photo&&!analyzing&&!result&&h`<div class="fade-in" style=${{textAlign:"center",paddingTop:30}}>
        <div style=${{fontSize:64,marginBottom:16}}>📸</div>
        <p style=${{color:"#eee",fontSize:16,fontWeight:700,marginBottom:8}}>성분표를 촬영해주세요</p>
        <p style=${{color:"#888",fontSize:12,lineHeight:1.6,marginBottom:24}}>사료, 간식, 영양제의 영양성분표/원재료를\n가까이서 선명하게 촬영하세요</p>
        <div style=${{position:"relative",display:"inline-block"}}>
          <button style=${{padding:"16px 40px",borderRadius:50,background:clr,color:"#fff",fontSize:16,fontWeight:800}}>📷 사진 촬영 / 선택</button>
          <input type="file" accept="image/*" capture="environment" onChange=${onPhoto} style=${{position:"absolute",inset:0,opacity:0,cursor:"pointer"}}/>
        </div>
      </div>`}
      ${photo&&h`<img src=${photo} style=${{width:"100%",maxHeight:300,objectFit:"contain",background:"#000",borderRadius:12,marginBottom:16}}/>`}
      ${analyzing&&h`<div style=${{textAlign:"center",padding:"30px 0"}}><div class="spinner"/><p style=${{color:"#4ECDC4",marginTop:16,fontSize:14,fontWeight:700}}>영양성분 분석 중...</p><p style=${{color:"#888",fontSize:12,marginTop:6}}>성분표를 읽고 있어요</p></div>`}
      ${error&&h`<div style=${{padding:14,background:"rgba(255,80,80,.12)",borderRadius:12,color:"#ff7070",fontSize:12,marginBottom:14}}>⚠️ ${error}</div>`}
      ${result&&h`<div class="fade-in"><div style=${{color:"#ccd",fontSize:13.5,lineHeight:1.8,whiteSpace:"pre-wrap"}}>${result}</div>
        <div style=${{marginTop:20,display:"flex",gap:10}}>
          <button style=${{flex:1,padding:14,borderRadius:12,background:"rgba(255,255,255,.06)",color:"#aaa",fontSize:13,fontWeight:700}} onClick=${goHome}>🏠 홈</button>
          <div style=${{flex:1,position:"relative"}}><button style=${{width:"100%",padding:14,borderRadius:12,background:clr+"22",border:"1px solid "+clr+"44",color:clr,fontSize:13,fontWeight:700}}>📷 다른 제품</button><input type="file" accept="image/*" capture="environment" onChange=${function(e){setPhoto(null);setResult("");onPhoto(e);}} style=${{position:"absolute",inset:0,opacity:0,cursor:"pointer"}}/></div>
        </div>
      </div>`}
    </div>
  </div>`;

  // ===== RECORD & ANALYZE SCREEN =====
  var totalSec=sm?sm.sec:20;
  var progress=totalSec>0?(totalSec-remain)/totalSec:0;
  var circumference=2*Math.PI*54;

  return h`<div style=${{maxWidth:520,margin:"0 auto",minHeight:"100dvh",background:"#111119",display:"flex",flexDirection:"column"}}>
    <div style=${{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"10px 14px",background:clr,position:"sticky",top:0,zIndex:10}}>
      <button style=${{background:"rgba(255,255,255,.18)",color:"#fff",padding:"7px 14px",borderRadius:8,fontSize:12.5}} onClick=${function(){cleanup();goHome();}}>← 홈</button>
      <span style=${{color:"#fff",fontSize:15,fontWeight:700}}>${sm?sm.icon:""} ${sm?sm.label:""}</span>
      ${!recording&&!analyzing&&!result?h`<button style=${{background:"rgba(255,255,255,.18)",color:"#fff",padding:"7px 14px",borderRadius:8,fontSize:12.5}} onClick=${flipCam}>🔄</button>`:h`<span style=${{width:56}}/>`}
    </div>
    <div style=${{flex:1,overflowY:"auto",background:"linear-gradient(180deg,#13131f,#161630)"}}>
      <!-- CAMERA PREVIEW -->
      ${!result&&!analyzing&&h`<div style=${{position:"relative",width:"100%",aspectRatio:"4/3",background:"#000",overflow:"hidden"}}>
        <video ref=${vRef} autoPlay playsInline muted style=${{width:"100%",height:"100%",objectFit:"cover"}}/>
        <canvas ref=${cRef} style=${{display:"none"}}/>
        ${!camOk&&h`<div style=${{position:"absolute",inset:0,background:"rgba(0,0,0,.8)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}><div class="spinner"/><p style=${{color:"#fff",marginTop:12}}>카메라 준비 중...</p></div>`}
        <!-- 녹화 중 오버레이 -->
        ${recording&&h`<div style=${{position:"absolute",top:12,left:12,display:"flex",alignItems:"center",gap:8,background:"rgba(0,0,0,.6)",padding:"6px 14px",borderRadius:20,zIndex:5}}><div class="rec-dot"/><span style=${{color:"#ff6666",fontSize:13,fontWeight:700}}>REC</span></div>`}
        <!-- 카운트다운 원형 -->
        ${recording&&h`<div style=${{position:"absolute",top:"50%",left:"50%",transform:"translate(-50%,-50%)",zIndex:5}}>
          <svg width="120" height="120" class="progress-ring"><circle cx="60" cy="60" r="54" fill="rgba(0,0,0,.4)" stroke="rgba(255,255,255,.15)" stroke-width="4"/><circle cx="60" cy="60" r="54" fill="none" stroke=${clr} stroke-width="4" stroke-linecap="round" stroke-dasharray=${circumference} stroke-dashoffset=${circumference*(1-progress)} style=${{transition:"stroke-dashoffset 1s linear",transform:"rotate(-90deg)",transformOrigin:"center"}}/></svg>
          <div style=${{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column"}}>
            <div class="count-num" key=${remain} style=${{color:"#fff",fontSize:32,fontWeight:900}}>${remain}</div>
            <div style=${{color:"rgba(255,255,255,.6)",fontSize:11}}>초 남음</div>
          </div>
        </div>`}
      </div>`}

      <!-- 촬영 전: 시작 버튼 -->
      ${!recording&&!analyzing&&!result&&camOk&&h`<div style=${{padding:"24px 20px",textAlign:"center"}}>
        <p style=${{color:"#eee",fontSize:15,fontWeight:700,marginBottom:6}}>${sm?sm.icon:""} ${sm?sm.label:""}</p>
        <p style=${{color:"#888",fontSize:12,marginBottom:20}}>${sm&&sm.sec>0?sm.sec+"초 동안 촬영합니다. 준비되면 시작!":"사진을 촬영하세요"}</p>
        <button style=${{padding:"18px 50px",borderRadius:50,background:clr,color:"#fff",fontSize:18,fontWeight:900,boxShadow:"0 4px 24px "+clr+"66"}} onClick=${startRec}>
          🎬 촬영 시작
        </button>
      </div>`}

      <!-- 녹화 중: 중지 버튼 -->
      ${recording&&h`<div style=${{padding:"16px 20px",textAlign:"center"}}>
        <p style=${{color:"#ff6666",fontSize:14,fontWeight:700,marginBottom:12}}>📹 촬영 중... ${sm?sm.icon:""} 분석을 위해 촬영하고 있어요</p>
        <button style=${{padding:"14px 40px",borderRadius:50,background:"rgba(255,70,70,.8)",color:"#fff",fontSize:14,fontWeight:700}} onClick=${stopRec}>⏹️ 촬영 완료 (조기 종료)</button>
      </div>`}

      <!-- 분석 중 -->
      ${analyzing&&h`<div style=${{padding:"50px 20px",textAlign:"center"}}>
        <div class="spinner"/>
        <p style=${{color:"#4ECDC4",marginTop:20,fontSize:16,fontWeight:700}}>AI 분석 중...</p>
        <p style=${{color:"#888",fontSize:12,marginTop:8}}>${frames.length||1}장의 프레임을 분석하고 있어요</p>
        <p style=${{color:"#666",fontSize:11,marginTop:4}}>잠시만 기다려주세요 (10~20초)</p>
      </div>`}

      ${error&&h`<div style=${{margin:"14px 18px",padding:14,background:"rgba(255,80,80,.12)",borderRadius:12,color:"#ff7070",fontSize:12}}>⚠️ ${error}</div>`}

      <!-- 결과 -->
      ${result&&h`<div class="fade-in" style=${{padding:"20px 18px"}}>
        <div style=${{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
          <span style=${{fontSize:22}}>${sm?sm.icon:""}</span>
          <span style=${{color:"#f0f0f5",fontSize:17,fontWeight:800}}>분석 결과</span>
        </div>
        <div style=${{color:"#ccd",fontSize:13.5,lineHeight:1.8,whiteSpace:"pre-wrap"}}>${result}</div>
        <div style=${{marginTop:24,display:"flex",gap:10}}>
          <button style=${{flex:1,padding:14,borderRadius:12,background:"rgba(255,255,255,.06)",color:"#aaa",fontSize:13,fontWeight:700}} onClick=${goHome}>🏠 홈</button>
          <button style=${{flex:1,padding:14,borderRadius:12,background:clr+"22",border:"1px solid "+clr+"44",color:clr,fontSize:13,fontWeight:700}} onClick=${function(){setResult("");setFrames([]);setError(null);setScr("record");setTimeout(function(){startCam(face);},100);}}>🔄 다시 촬영</button>
        </div>
      </div>`}
    </div>
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(h`<${App}/>`);
} // end else
</script>
</body>
</html>
